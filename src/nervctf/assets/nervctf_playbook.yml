---
- hosts: ctfd
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"

  tasks:
    # ── Docker ─────────────────────────────────────────────────────────────────
    - name: Check if Docker is installed
      command: docker --version
      register: docker_installed
      changed_when: false
      ignore_errors: yes

    - name: Install Docker
      when: docker_installed.rc != 0
      block:
        - name: Install apt prerequisites
          apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: yes

        - name: Create keyring directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
            force: no

        - name: Add Docker apt repository
          apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present
            update_cache: yes

        - name: Install Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    # ── Docker daemon config ───────────────────────────────────────────────────
    # Expand the default bridge-network address pool from ~30 to ~4096 /24s.
    # Without this, docker compose up fails with "could not find an available,
    # non-overlapping IPv4 address pool" once ~30 teams have active instances.
    - name: Write Docker daemon config (expanded address pool)
      copy:
        content: |
          {
            "default-address-pools": [
              {"base": "172.16.0.0/12", "size": 24}
            ]
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      register: docker_daemon_json

    - name: Restart Docker daemon if config changed
      systemd:
        name: docker
        state: restarted
      when: docker_daemon_json.changed

    # ── Docker user ────────────────────────────────────────────────────────────
    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Look up the docker user's current login shell
      getent:
        database: passwd
        key: "{{ docker_user }}"
        fail_key: false
      register: docker_user_passwd
      changed_when: false

    # `shell:` is deliberately conditional rather than a hardcoded /bin/bash. The
    # `user` module enforces whatever it is given on *every* run, so hardcoding it
    # rewrote the login shell of an already-existing account each time `nervctf setup`
    # ran — and since `docker_user` defaults to `ansible_user`, on a single-machine
    # deployment that is usually root, whose shell the operator may well have changed
    # on purpose. Preserve whatever the account already uses; only pick a default when
    # this run is actually creating the account.
    - name: Ensure docker user exists
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
        state: present
        create_home: yes
        shell: >-
          {{ (docker_user_passwd.ansible_facts.getent_passwd | default({})).get(docker_user)[5]
             if (docker_user_passwd.ansible_facts.getent_passwd | default({})).get(docker_user)
             else '/bin/bash' }}

    # ── SSH key ────────────────────────────────────────────────────────────────
    # `ssh_pubkey` (public key contents) is resolved by the CLI from the private
    # `ssh_key_path` used by `nervctf deploy`.
    - name: Authorize SSH public key for docker user
      authorized_key:
        user: "{{ docker_user }}"
        state: present
        key: "{{ ssh_pubkey }}"

    # ── CTFd clone ─────────────────────────────────────────────────────────────
    - name: Check if CTFd is already cloned
      stat:
        path: "{{ ctfd_path }}/requirements.txt"
      register: ctfd_cloned

    # Pin CTFd to the tested version. This only runs on first install (when: not ctfd_cloned.stat.exists).
    # On subsequent runs, use 'nervctf probe' (or the upgrade playbook) to verify the installed version.
    # Supported version: 3.7.3 — update this value and re-test when upgrading CTFd.
    - name: Clone CTFd
      git:
        repo: https://github.com/CTFd/CTFd.git
        dest: "{{ ctfd_path }}"
        version: "3.7.3"
        depth: 1
      become_user: "{{ docker_user }}"
      when: not ctfd_cloned.stat.exists

    # ── LXC / LXD ──────────────────────────────────────────────────────────────
    - name: Check if LXD is installed
      command: lxd --version
      register: lxd_installed
      changed_when: false
      ignore_errors: yes

    - name: Install LXD via snap
      snap:
        name: lxd
        state: present
      when: lxd_installed.rc != 0
      ignore_errors: yes

    - name: Initialize LXD (auto)
      command: lxd init --auto
      when: lxd_installed.rc != 0
      ignore_errors: yes

    - name: Add docker user to lxd group
      user:
        name: "{{ docker_user }}"
        groups: lxd
        append: yes
      ignore_errors: yes

    # ── Vagrant ────────────────────────────────────────────────────────────────
    - name: Check if Vagrant is installed
      command: vagrant --version
      register: vagrant_installed
      changed_when: false
      ignore_errors: yes

    - name: Install Vagrant build deps
      apt:
        name:
          [
            libvirt-daemon-system,
            libvirt-clients,
            qemu-kvm,
            bridge-utils,
            ruby-dev,
          ]
        state: present
        update_cache: yes
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Add HashiCorp apt key
      get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/keyrings/hashicorp.asc
        mode: "0644"
        force: no
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Add HashiCorp apt repository
      apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/hashicorp.asc]
          https://apt.releases.hashicorp.com
          {{ ansible_distribution_release }} main
        filename: hashicorp
        state: present
        update_cache: yes
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Install Vagrant
      apt:
        name: vagrant
        state: present
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Add docker user to libvirt group
      user:
        name: "{{ docker_user }}"
        groups: libvirt
        append: yes
      ignore_errors: yes

    # ── CTFd Plugin ────────────────────────────────────────────────────────────
    - name: Deploy NervCTF instance plugin to CTFd
      when: plugin_src is defined
      block:
        - name: Ensure CTFd plugins directory exists
          file:
            path: "{{ ctfd_path }}/CTFd/plugins/nervctf_instance"
            state: directory
            owner: "{{ docker_user }}"
            group: docker
            mode: "0755"

        - name: Copy plugin files
          synchronize:
            src: "{{ plugin_src }}/"
            dest: "{{ ctfd_path }}/CTFd/plugins/nervctf_instance/"
            delete: yes
            rsync_opts:
              - "--chown={{ docker_user }}:docker"

    # ── Remote Monitor Docker image ────────────────────────────────────────────
    # NOTE: Build the image BEFORE starting CTFd so that if a previous
    # docker-compose.override.yml is already on disk (reinstall scenario),
    # docker compose up doesn't fail trying to pull nervctf-monitor:latest
    # from Docker Hub.
    - name: Ensure remote-monitor directory exists
      file:
        path: "{{ ctfd_path }}/remote-monitor"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: monitor_binary is defined

    - name: Copy remote-monitor binary
      copy:
        src: "{{ monitor_binary }}"
        dest: "{{ ctfd_path }}/remote-monitor/remote-monitor"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: monitor_binary is defined

    # NOTE: This Dockerfile is duplicated in nervctf_upgrade_playbook.yml / nervctf_playbook.yml — keep them in sync.
    - name: Write remote-monitor Dockerfile
      copy:
        content: |
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates curl gnupg libsqlite3-0 openssh-client && \
              install -m 0755 -d /etc/apt/keyrings && \
              curl -fsSL https://download.docker.com/linux/debian/gpg \
                | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/debian bookworm stable" \
                > /etc/apt/sources.list.d/docker.list && \
              apt-get update && \
              apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin && \
              rm -rf /var/lib/apt/lists/*
          RUN printf '#!/bin/sh\n\
          if [ -f /run/monitor_ssh_key ]; then\n\
            mkdir -p /root/.ssh && chmod 700 /root/.ssh\n\
            cp /run/monitor_ssh_key /root/.ssh/id_rsa && chmod 600 /root/.ssh/id_rsa\n\
            printf "Host *\\n  StrictHostKeyChecking no\\n  UserKnownHostsFile /dev/null\\n  LogLevel ERROR\\n" > /root/.ssh/config\n\
            chmod 600 /root/.ssh/config\n\
          fi\n\
          exec "$@"\n' > /entrypoint.sh && chmod +x /entrypoint.sh
          COPY remote-monitor /usr/local/bin/remote-monitor
          ENTRYPOINT ["/entrypoint.sh"]
          CMD ["/usr/local/bin/remote-monitor"]
        dest: "{{ ctfd_path }}/remote-monitor/Dockerfile"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"
      when: monitor_binary is defined

    - name: Build remote-monitor Docker image
      command: docker build -t nervctf-monitor:latest {{ ctfd_path }}/remote-monitor
      become_user: "{{ docker_user }}"
      when: monitor_binary is defined

    # ── nervctf-tap Docker image (instance traffic-capture sidecar) ───────────
    # Replaces nervctf-proxy. The tap is a byte-transparent L4 relay: it records the
    # raw stream and interprets no application protocol, so one sidecar covers nc,
    # raw TCP/UDP, SSH, TLS and HTTP alike. See docs/instance-challenges.md.
    - name: Ensure nervctf-tap directory exists
      file:
        path: "{{ ctfd_path }}/nervctf-tap"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: tap_binary is defined

    - name: Copy nervctf-tap binary
      copy:
        src: "{{ tap_binary }}"
        dest: "{{ ctfd_path }}/nervctf-tap/nervctf-tap"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: tap_binary is defined

    # NOTE: This Dockerfile is duplicated in nervctf_upgrade_playbook.yml and in
    # src/nervctf-tap/Dockerfile — keep all three in sync.
    # No ca-certificates, unlike nervctf-proxy: the tap opens no TLS connections of
    # its own, it only relays bytes.
    - name: Write nervctf-tap Dockerfile
      copy:
        content: |
          FROM debian:bookworm-slim
          COPY nervctf-tap /usr/local/bin/nervctf-tap
          ENTRYPOINT ["/usr/local/bin/nervctf-tap"]
        dest: "{{ ctfd_path }}/nervctf-tap/Dockerfile"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"
      when: tap_binary is defined

    - name: Build nervctf-tap Docker image
      command: docker build -t nervctf-tap:latest {{ ctfd_path }}/nervctf-tap
      become_user: "{{ docker_user }}"
      when: tap_binary is defined

    # ── Capture directory ─────────────────────────────────────────────────────
    # Bind-mounted into each tap sidecar (read-write) and into remote-monitor
    # (read-only) at the *same* absolute path, so no path translation is needed —
    # the same convention /tmp/ctf-flags already uses.
    #
    # mode 0777 because each tap container runs as its own uid; consistent with the
    # Grafana/Loki data dirs below rather than per-image uid mapping.
    #
    # NOT purged on instance teardown: captures are the evidence an integrity review
    # runs on, so they outlive the instance. Retention is a separate operator decision.
    - name: Ensure nervctf capture directory exists
      file:
        path: /var/lib/nervctf-captures
        state: directory
        mode: "0777"

    # ── Monitor data directory (bind mount — host path must equal container path
    #    so the host Docker daemon can resolve challenge compose build contexts and
    #    volume paths at the same absolute path the monitor writes them with.)
    - name: Create monitor data directory on host
      file:
        path: "{{ ctfd_path }}/remote-monitor/data/challenges"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    # ── Read CTFd DB credentials for remote-monitor ────────────────────────────
    - name: Read CTFd .env for database URL
      slurp:
        src: "{{ ctfd_path }}/.env"
      register: ctfd_env_raw
      failed_when: false

    - name: Extract CTFD_DB_URL from CTFd .env
      set_fact:
        ctfd_db_url: >-
          {{
            (ctfd_env_raw.content | default('') | b64decode)
            | regex_findall('DATABASE_URL=([^\n\r]+)')
            | first
            | default('mysql://ctfd:ctfd@db/ctfd')
            | regex_replace('\+pymysql', '')
          }}

    # Decompose ctfd_db_url (mysql://user:pass@host[:port]/db) into discrete fields —
    # Grafana's MySQL datasource wants separate host/port/database/user/password, not
    # a single connection URL.
    - name: Decompose CTFD_DB_URL for Grafana's MySQL datasource
      set_fact:
        ctfd_db_user: "{{ ctfd_db_url | regex_replace('^mysql://([^:]+):.*$', '\\1') }}"
        ctfd_db_pass: "{{ ctfd_db_url | regex_replace('^mysql://[^:]+:([^@]+)@.*$', '\\1') }}"
        ctfd_db_host_raw: "{{ ctfd_db_url | regex_replace('^mysql://[^@]+@([^/]+)/.*$', '\\1') }}"
        ctfd_db_name: "{{ ctfd_db_url | regex_replace('^mysql://[^/]+/([^?]*).*$', '\\1') }}"

    - name: Append default MySQL port if CTFD_DB_URL host had none
      set_fact:
        ctfd_db_host: "{{ ctfd_db_host_raw if ':' in ctfd_db_host_raw else ctfd_db_host_raw + ':3306' }}"

    # ── SSH keypair for monitor→runner (split-machine mode only) ──────────────
    - name: Generate SSH keypair for remote-monitor (split mode)
      when: runner_ip is defined
      command: >-
        ssh-keygen -t rsa -b 4096 -N ""
        -f {{ ctfd_path }}/remote-monitor/monitor_ssh_key
      args:
        creates: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key"
      become_user: "{{ docker_user }}"

    - name: Set monitor SSH private key permissions
      when: runner_ip is defined
      file:
        path: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key"
        mode: "0600"
        owner: "{{ docker_user }}"
        group: docker

    - name: Read monitor SSH public key
      when: runner_ip is defined
      slurp:
        src: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key.pub"
      register: monitor_pubkey_raw
      failed_when: false

    - name: Set monitor_pubkey fact
      when: runner_ip is defined and monitor_pubkey_raw.content is defined
      set_fact:
        monitor_pubkey: "{{ monitor_pubkey_raw.content | b64decode | trim }}"

    - name: Write SSH client config for monitor container
      when: runner_ip is defined
      copy:
        content: |
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
        dest: "{{ ctfd_path }}/remote-monitor/ssh_config"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Resolve runner hostname → IP (for monitor container, which lacks Tailscale
    #    search domains and cannot resolve bare hostnames like "remote-instances") ─
    - name: Resolve runner hostname to IP on CTFd host
      when: runner_ip is defined
      command: "getent hosts {{ runner_ip }}"
      register: runner_getent
      changed_when: false
      failed_when: false

    - name: Set runner_resolved_ip fact
      when: runner_ip is defined
      set_fact:
        runner_resolved_ip: >-
          {{
            (runner_getent.stdout.split() | first)
            if (runner_getent is defined and (runner_getent.rc | int) == 0 and runner_getent.stdout != '')
            else runner_ip
          }}

    # ── Grafana/Prometheus/Loki data directories (host resource monitoring +
    #    opt-in log_proxy player-traffic logging) ────────────────────────────────
    # mode 0777: the grafana/prometheus/loki images run as their own non-root UIDs
    # that don't line up with {{ docker_user }} — simplest robust fix for a bind
    # mount, consistent with this project's existing "operator firewalls it" posture
    # for admin-only surfaces rather than precise UID-mapping.
    - name: Ensure Grafana/Prometheus/Loki data directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ ctfd_path }}/grafana/data"
        - "{{ ctfd_path }}/prometheus/data"
        - "{{ ctfd_path }}/loki/data"

    # ── Loki config ─────────────────────────────────────────────────────────────
    # Minimal single-binary filesystem config. Loki is always bound to 127.0.0.1
    # only — never exposed beyond this host — and is only ever reached by:
    #   - the log-proxy sidecar's own `--log-driver=loki` push, which in
    #     split-machine mode runs on the *runner* host and reaches this loopback
    #     address through a persistent reverse SSH tunnel (see below), not a
    #     public/firewalled port;
    #   - Grafana, over the compose network, by container name.
    - name: Write Loki config
      copy:
        content: |
          auth_enabled: false
          server:
            http_listen_port: 3100
          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            # The log-proxy sidecar's own JSON lines can run large (truncated body
            # previews still add up); raise Loki's default per-line/per-stream caps
            # rather than silently dropping entries.
            max_line_size: 256KB
            ingestion_rate_mb: 16
            ingestion_burst_size_mb: 32
        dest: "{{ ctfd_path }}/loki/loki-config.yaml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Loki Docker logging-driver plugin ───────────────────────────────────────
    # Required on whichever host actually runs the log-proxy sidecar's `docker run`/
    # `docker compose up` with `--log-driver=loki`: the primary host in single-machine
    # mode (this play), or the runner host in split-machine mode (separate play below).
    - name: Check if Loki Docker logging-driver plugin is installed
      when: runner_ip is not defined
      command: "{% raw %}docker plugin ls --format '{{.Name}}'{% endraw %}"
      register: docker_plugins_primary
      changed_when: false
      failed_when: false

    - name: Install Loki Docker logging-driver plugin
      when: runner_ip is not defined and 'loki:latest' not in docker_plugins_primary.stdout
      command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      register: loki_plugin_install_primary
      failed_when: loki_plugin_install_primary.rc != 0 and 'already exist' not in loki_plugin_install_primary.stderr

    - name: Ensure Prometheus config directory exists
      file:
        path: "{{ ctfd_path }}/prometheus"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Prometheus scrape config
      copy:
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]
            - job_name: remote-monitor
              static_configs:
                - targets: ["remote-monitor:{{ monitor_port }}"]
        dest: "{{ ctfd_path }}/prometheus/prometheus.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Ensure Grafana provisioning directory exists
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/datasources"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Grafana Prometheus datasource
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/prometheus.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write Grafana Loki datasource
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki:3100
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/loki.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # Reuses remote-monitor's own CTFd DB credentials (full read-write) rather than a
    # scoped read-only grant — there is no MariaDB root password available anywhere in
    # this playbook to create one with (CTFd's `db` service comes from CTFd's own
    # upstream-authored docker-compose.yml, not this playbook). This isn't a new
    # privilege boundary: Grafana has exactly one account in this whole stack
    # (admin/monitor_token, same as everywhere else here), so there's no second,
    # lower-trust identity this could leak into.
    - name: Write Grafana MySQL datasource (CTFd's MariaDB, for scoreboard dashboards)
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: CTFd
              uid: ctfd-mysql
              type: mysql
              access: proxy
              url: "{{ ctfd_db_host }}"
              database: "{{ ctfd_db_name }}"
              user: "{{ ctfd_db_user }}"
              secureJsonData:
                password: "{{ ctfd_db_pass }}"
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/mysql.yml"
        owner: "{{ docker_user }}"
        # Group root, not docker: the Grafana image runs as uid 472 / gid 0, so it is
        # neither the owner nor in the `docker` group and cannot read a 0640 file —
        # provisioning then fails with "permission denied" and Grafana crash-loops,
        # taking every dashboard down with it. Group 0 lets Grafana read it while
        # keeping the file non-world-readable, which matters here because unlike the
        # other datasource files this one carries a credential.
        group: "0"
        mode: "0640"

    - name: Write Grafana Infinity datasource (remote-monitor's admin JSON API)
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: NervCTF Admin API
              uid: nervctf-infinity
              type: yesoreyeram-infinity-datasource
              access: proxy
              url: "http://remote-monitor:{{ monitor_port }}"
              jsonData:
                httpHeaderName1: "Authorization"
              secureJsonData:
                httpHeaderValue1: "Token {{ monitor_token }}"
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/infinity.yml"
        owner: "{{ docker_user }}"
        # Group root, not docker: the Grafana image runs as uid 472 / gid 0, so it is
        # neither the owner nor in the `docker` group and cannot read a 0640 file —
        # provisioning then fails with "permission denied" and Grafana crash-loops,
        # taking every dashboard down with it. Group 0 lets Grafana read it while
        # keeping the file non-world-readable, which matters here because unlike the
        # other datasource files this one carries a credential.
        group: "0"
        mode: "0640"

    # ── Grafana dashboards (shipped, not left for the operator to build) ───────
    - name: Ensure Grafana dashboard provisioning directory exists
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/dashboards"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Grafana dashboard provider config
      copy:
        content: |
          apiVersion: 1
          providers:
            - name: NervCTF
              orgId: 1
              folder: ""
              type: file
              disableDeletion: true
              updateIntervalSeconds: 30
              allowUiUpdates: false
              options:
                path: /etc/grafana/provisioning/dashboards
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/dashboards.yml"
        owner: "{{ docker_user }}"
        group: docker
