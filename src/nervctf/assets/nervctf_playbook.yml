    # ── NervCTF Integrity dashboard ────────────────────────────────────────────
    # The anti-cheat view. Every panel runs on data that already exists — the
    # monitor's own event log and CTFd's `submissions` table — so none of it depends
    # on traffic capture being enabled, and it covers standard challenges too.
    #
    # Ranked roughly by signal-to-noise: the monitor's own findings first (it knows
    # which flag belongs to which team's instance, so those are near-certain), then
    # the CTFd-derived heuristics, which need an operator's judgement.
    - name: Write NervCTF integrity dashboard
      copy:
        content: |
          {
            "title": "NervCTF Integrity",
            "uid": "nervctf-integrity",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-24h", "to": "now" },
            "refresh": "1m",
            "panels": [
              {
                "id": 1,
                "title": "How to read this",
                "type": "text",
                "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
                "options": {
                  "mode": "markdown",
                  "content": "Panels are ordered by confidence, strongest first.\n\n**Near-certain** (monitor-derived, each instance has a unique flag): *Foreign flag submitted* and *Solved without an instance*. A team cannot solve an instance challenge it was never given an instance of.\n\n**Needs judgement** (CTFd-derived heuristics): the rest. Known false positives \u2014 shared IPs are normal behind one NAT, campus network or VPN; simultaneous solves cluster at challenge release; a challenge converted from standard to instance mid-event will show spurious *Solved without an instance* rows. Confirm before accusing anyone.\n\nTeam-mode only. In CTFd user-mode `submissions.team_id` is NULL and the CTFd-derived panels will be empty."
                }
              },
              {
                "id": 2,
                "title": "Foreign flag submitted (near-certain)",
                "description": "A team submitted a flag that belongs to another team's instance. The monitor generates a unique flag per instance, so this is direct evidence of sharing.",
                "type": "table",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/attempts?alerts_only=true",
                    "url_options": { "method": "GET" },
                    "root_selector": "$"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Solved without an instance (near-certain)",
                "description": "Correct solve for an instance challenge with no instance.requested event for that team, or a solve timestamped before their first request. There was nothing for them to solve.",
                "type": "table",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 15 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/integrity",
                    "url_options": { "method": "GET" },
                    "root_selector": "$"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Same wrong flag submitted by multiple teams",
                "description": "Two teams submitting the identical incorrect string for the same challenge shared an answer. One of the strongest CTFd-only signals, because a wrong guess is not independently reproducible.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, s.provided AS submitted_flag, COUNT(DISTINCT s.team_id) AS teams, GROUP_CONCAT(DISTINCT t.name ORDER BY t.name SEPARATOR ', ') AS team_names, MIN(s.date) AS first_seen FROM submissions s JOIN teams t ON t.id = s.team_id JOIN challenges c ON c.id = s.challenge_id WHERE s.type = 'incorrect' AND t.hidden = 0 AND t.banned = 0 AND CHAR_LENGTH(s.provided) >= 8 GROUP BY s.challenge_id, c.name, s.provided HAVING teams > 1 ORDER BY teams DESC, first_seen ASC LIMIT 200",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 5,
                "title": "Submission IP shared across teams",
                "description": "CTFd records the submitter IP. The same address submitting for several teams suggests one person on multiple accounts. Expect false positives behind a shared NAT, campus network or VPN.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 34 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT s.ip AS ip, COUNT(DISTINCT s.team_id) AS teams, GROUP_CONCAT(DISTINCT t.name ORDER BY t.name SEPARATOR ', ') AS team_names, COUNT(*) AS submissions, MIN(s.date) AS first_seen, MAX(s.date) AS last_seen FROM submissions s JOIN teams t ON t.id = s.team_id WHERE s.ip IS NOT NULL AND s.ip <> '' AND t.hidden = 0 AND t.banned = 0 GROUP BY s.ip HAVING teams > 1 ORDER BY teams DESC, submissions DESC LIMIT 200",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 6,
                "title": "Near-simultaneous solves (same challenge, within 3 min)",
                "description": "Team pairs solving the same challenge close together. Clusters legitimately at challenge release, so read it alongside the first-blood times on the Scoreboard dashboard.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 44 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, ta.name AS team_a, tb.name AS team_b, a.date AS first_solved_at, ABS(TIMESTAMPDIFF(SECOND, a.date, b.date)) AS seconds_apart FROM submissions a JOIN submissions b ON b.challenge_id = a.challenge_id AND b.type = 'correct' AND b.team_id > a.team_id AND ABS(TIMESTAMPDIFF(SECOND, a.date, b.date)) <= 180 JOIN challenges c ON c.id = a.challenge_id JOIN teams ta ON ta.id = a.team_id JOIN teams tb ON tb.id = b.team_id WHERE a.type = 'correct' AND ta.hidden = 0 AND ta.banned = 0 AND tb.hidden = 0 AND tb.banned = 0 ORDER BY seconds_apart ASC LIMIT 200",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 7,
                "title": "Flag brute-forcing",
                "description": "Teams with a high rate of incorrect submissions on one challenge — scripted guessing rather than solving. Only rows with at least 20 wrong attempts are shown.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 54 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT t.name AS team, c.name AS challenge, COUNT(*) AS incorrect, TIMESTAMPDIFF(SECOND, MIN(s.date), MAX(s.date)) AS window_seconds, ROUND(COUNT(*) * 60.0 / GREATEST(TIMESTAMPDIFF(SECOND, MIN(s.date), MAX(s.date)), 1), 1) AS per_minute FROM submissions s JOIN teams t ON t.id = s.team_id JOIN challenges c ON c.id = s.challenge_id WHERE s.type = 'incorrect' AND t.hidden = 0 AND t.banned = 0 GROUP BY t.id, t.name, c.id, c.name HAVING incorrect >= 20 ORDER BY per_minute DESC LIMIT 100",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/integrity.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write NervCTF provisioning-health dashboard
