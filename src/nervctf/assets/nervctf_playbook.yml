    - name: Write NervCTF host-resources dashboard
      copy:
        content: |
          {
            "title": "NervCTF Host Resources",
            "uid": "nervctf-host-resources",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "CPU usage %",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                    "legendFormat": "CPU"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Memory usage %",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
                    "legendFormat": "Memory"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Disk usage % (root)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"}) * 100)",
                    "legendFormat": "Disk"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Network I/O (bytes/s)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])",
                    "legendFormat": "RX {{ '{{device}}' }}"
                  },
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])",
                    "legendFormat": "TX {{ '{{device}}' }}"
                  }
                ]
              }
