---
- hosts: ctfd
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"

  tasks:
    # ── Docker ─────────────────────────────────────────────────────────────────
    - name: Check if Docker is installed
      command: docker --version
      register: docker_installed
      changed_when: false
      ignore_errors: yes

    - name: Install Docker
      when: docker_installed.rc != 0
      block:
        - name: Install apt prerequisites
          apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: yes

        - name: Create keyring directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
            force: no

        - name: Add Docker apt repository
          apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present
            update_cache: yes

        - name: Install Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    # ── Docker daemon config ───────────────────────────────────────────────────
    # Expand the default bridge-network address pool from ~30 to ~4096 /24s.
    # Without this, docker compose up fails with "could not find an available,
    # non-overlapping IPv4 address pool" once ~30 teams have active instances.
    - name: Write Docker daemon config (expanded address pool)
      copy:
        content: |
          {
            "default-address-pools": [
              {"base": "172.16.0.0/12", "size": 24}
            ]
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      register: docker_daemon_json

    - name: Restart Docker daemon if config changed
      systemd:
        name: docker
        state: restarted
      when: docker_daemon_json.changed

    # ── Docker user ────────────────────────────────────────────────────────────
    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Ensure docker user exists
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
        shell: /bin/bash
        state: present
        create_home: yes

    # ── SSH key ────────────────────────────────────────────────────────────────
    # `ssh_pubkey` (public key contents) is resolved by the CLI from the private
    # `ssh_key_path` used by `nervctf deploy`.
    - name: Authorize SSH public key for docker user
      authorized_key:
        user: "{{ docker_user }}"
        state: present
        key: "{{ ssh_pubkey }}"

    # ── CTFd clone ─────────────────────────────────────────────────────────────
    - name: Check if CTFd is already cloned
      stat:
        path: "{{ ctfd_path }}/requirements.txt"
      register: ctfd_cloned

    # Pin CTFd to the tested version. This only runs on first install (when: not ctfd_cloned.stat.exists).
    # On subsequent runs, use 'nervctf probe' (or the upgrade playbook) to verify the installed version.
    # Supported version: 3.7.3 — update this value and re-test when upgrading CTFd.
    - name: Clone CTFd
      git:
        repo: https://github.com/CTFd/CTFd.git
        dest: "{{ ctfd_path }}"
        version: "3.7.3"
        depth: 1
      become_user: "{{ docker_user }}"
      when: not ctfd_cloned.stat.exists

    # ── LXC / LXD ──────────────────────────────────────────────────────────────
    - name: Check if LXD is installed
      command: lxd --version
      register: lxd_installed
      changed_when: false
      ignore_errors: yes

    - name: Install LXD via snap
      snap:
        name: lxd
        state: present
      when: lxd_installed.rc != 0
      ignore_errors: yes

    - name: Initialize LXD (auto)
      command: lxd init --auto
      when: lxd_installed.rc != 0
      ignore_errors: yes

    - name: Add docker user to lxd group
      user:
        name: "{{ docker_user }}"
        groups: lxd
        append: yes
      ignore_errors: yes

    # ── Vagrant ────────────────────────────────────────────────────────────────
    - name: Check if Vagrant is installed
      command: vagrant --version
      register: vagrant_installed
      changed_when: false
      ignore_errors: yes

    - name: Install Vagrant build deps
      apt:
        name:
          [
            libvirt-daemon-system,
            libvirt-clients,
            qemu-kvm,
            bridge-utils,
            ruby-dev,
          ]
        state: present
        update_cache: yes
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Add HashiCorp apt key
      get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/keyrings/hashicorp.asc
        mode: "0644"
        force: no
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Add HashiCorp apt repository
      apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/hashicorp.asc]
          https://apt.releases.hashicorp.com
          {{ ansible_distribution_release }} main
        filename: hashicorp
        state: present
        update_cache: yes
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Install Vagrant
      apt:
        name: vagrant
        state: present
      when: vagrant_installed.rc != 0
      ignore_errors: yes

    - name: Add docker user to libvirt group
      user:
        name: "{{ docker_user }}"
        groups: libvirt
        append: yes
      ignore_errors: yes

    # ── CTFd Plugin ────────────────────────────────────────────────────────────
    - name: Deploy NervCTF instance plugin to CTFd
      when: plugin_src is defined
      block:
        - name: Ensure CTFd plugins directory exists
          file:
            path: "{{ ctfd_path }}/CTFd/plugins/nervctf_instance"
            state: directory
            owner: "{{ docker_user }}"
            group: docker
            mode: "0755"

        - name: Copy plugin files
          synchronize:
            src: "{{ plugin_src }}/"
            dest: "{{ ctfd_path }}/CTFd/plugins/nervctf_instance/"
            delete: yes
            rsync_opts:
              - "--chown={{ docker_user }}:docker"

    # ── Remote Monitor Docker image ────────────────────────────────────────────
    # NOTE: Build the image BEFORE starting CTFd so that if a previous
    # docker-compose.override.yml is already on disk (reinstall scenario),
    # docker compose up doesn't fail trying to pull nervctf-monitor:latest
    # from Docker Hub.
    - name: Ensure remote-monitor directory exists
      file:
        path: "{{ ctfd_path }}/remote-monitor"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: monitor_binary is defined

    - name: Copy remote-monitor binary
      copy:
        src: "{{ monitor_binary }}"
        dest: "{{ ctfd_path }}/remote-monitor/remote-monitor"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: monitor_binary is defined

    # NOTE: This Dockerfile is duplicated in nervctf_upgrade_playbook.yml / nervctf_playbook.yml — keep them in sync.
    - name: Write remote-monitor Dockerfile
      copy:
        content: |
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates curl gnupg libsqlite3-0 openssh-client && \
              install -m 0755 -d /etc/apt/keyrings && \
              curl -fsSL https://download.docker.com/linux/debian/gpg \
                | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/debian bookworm stable" \
                > /etc/apt/sources.list.d/docker.list && \
              apt-get update && \
              apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin && \
              rm -rf /var/lib/apt/lists/*
          RUN printf '#!/bin/sh\n\
          if [ -f /run/monitor_ssh_key ]; then\n\
            mkdir -p /root/.ssh && chmod 700 /root/.ssh\n\
            cp /run/monitor_ssh_key /root/.ssh/id_rsa && chmod 600 /root/.ssh/id_rsa\n\
            printf "Host *\\n  StrictHostKeyChecking no\\n  UserKnownHostsFile /dev/null\\n  LogLevel ERROR\\n" > /root/.ssh/config\n\
            chmod 600 /root/.ssh/config\n\
          fi\n\
          exec "$@"\n' > /entrypoint.sh && chmod +x /entrypoint.sh
          COPY remote-monitor /usr/local/bin/remote-monitor
          ENTRYPOINT ["/entrypoint.sh"]
          CMD ["/usr/local/bin/remote-monitor"]
        dest: "{{ ctfd_path }}/remote-monitor/Dockerfile"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"
      when: monitor_binary is defined

    - name: Build remote-monitor Docker image
      command: docker build -t nervctf-monitor:latest {{ ctfd_path }}/remote-monitor
      become_user: "{{ docker_user }}"
      when: monitor_binary is defined

    # ── nervctf-proxy Docker image (HTTP instance traffic-logging sidecar) ────
    - name: Ensure nervctf-proxy directory exists
      file:
        path: "{{ ctfd_path }}/nervctf-proxy"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: proxy_binary is defined

    - name: Copy nervctf-proxy binary
      copy:
        src: "{{ proxy_binary }}"
        dest: "{{ ctfd_path }}/nervctf-proxy/nervctf-proxy"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: proxy_binary is defined

    # NOTE: This Dockerfile is duplicated in nervctf_upgrade_playbook.yml — keep in sync.
    - name: Write nervctf-proxy Dockerfile
      copy:
        content: |
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && \
              rm -rf /var/lib/apt/lists/*
          COPY nervctf-proxy /usr/local/bin/nervctf-proxy
          ENTRYPOINT ["/usr/local/bin/nervctf-proxy"]
        dest: "{{ ctfd_path }}/nervctf-proxy/Dockerfile"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"
      when: proxy_binary is defined

    - name: Build nervctf-proxy Docker image
      command: docker build -t nervctf-proxy:latest {{ ctfd_path }}/nervctf-proxy
      become_user: "{{ docker_user }}"
      when: proxy_binary is defined

    # ── Monitor data directory (bind mount — host path must equal container path
    #    so the host Docker daemon can resolve challenge compose build contexts and
    #    volume paths at the same absolute path the monitor writes them with.)
    - name: Create monitor data directory on host
      file:
        path: "{{ ctfd_path }}/remote-monitor/data/challenges"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    # ── Read CTFd DB credentials for remote-monitor ────────────────────────────
    - name: Read CTFd .env for database URL
      slurp:
        src: "{{ ctfd_path }}/.env"
      register: ctfd_env_raw
      failed_when: false

    - name: Extract CTFD_DB_URL from CTFd .env
      set_fact:
        ctfd_db_url: >-
          {{
            (ctfd_env_raw.content | default('') | b64decode)
            | regex_findall('DATABASE_URL=([^\n\r]+)')
            | first
            | default('mysql://ctfd:ctfd@db/ctfd')
            | regex_replace('\+pymysql', '')
          }}

    # ── SSH keypair for monitor→runner (split-machine mode only) ──────────────
    - name: Generate SSH keypair for remote-monitor (split mode)
      when: runner_ip is defined
      command: >-
        ssh-keygen -t rsa -b 4096 -N ""
        -f {{ ctfd_path }}/remote-monitor/monitor_ssh_key
      args:
        creates: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key"
      become_user: "{{ docker_user }}"

    - name: Set monitor SSH private key permissions
      when: runner_ip is defined
      file:
        path: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key"
        mode: "0600"
        owner: "{{ docker_user }}"
        group: docker

    - name: Read monitor SSH public key
      when: runner_ip is defined
      slurp:
        src: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key.pub"
      register: monitor_pubkey_raw
      failed_when: false

    - name: Set monitor_pubkey fact
      when: runner_ip is defined and monitor_pubkey_raw.content is defined
      set_fact:
        monitor_pubkey: "{{ monitor_pubkey_raw.content | b64decode | trim }}"

    - name: Write SSH client config for monitor container
      when: runner_ip is defined
      copy:
        content: |
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
        dest: "{{ ctfd_path }}/remote-monitor/ssh_config"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Resolve runner hostname → IP (for monitor container, which lacks Tailscale
    #    search domains and cannot resolve bare hostnames like "remote-instances") ─
    - name: Resolve runner hostname to IP on CTFd host
      when: runner_ip is defined
      command: "getent hosts {{ runner_ip }}"
      register: runner_getent
      changed_when: false
      failed_when: false

    - name: Set runner_resolved_ip fact
      when: runner_ip is defined
      set_fact:
        runner_resolved_ip: >-
          {{
            (runner_getent.stdout.split() | first)
            if (runner_getent is defined and (runner_getent.rc | int) == 0 and runner_getent.stdout != '')
            else runner_ip
          }}

    # ── Grafana/Prometheus/Loki data directories (host resource monitoring +
    #    opt-in log_proxy player-traffic logging) ────────────────────────────────
    # mode 0777: the grafana/prometheus/loki images run as their own non-root UIDs
    # that don't line up with {{ docker_user }} — simplest robust fix for a bind
    # mount, consistent with this project's existing "operator firewalls it" posture
    # for admin-only surfaces rather than precise UID-mapping.
    - name: Ensure Grafana/Prometheus/Loki data directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ ctfd_path }}/grafana/data"
        - "{{ ctfd_path }}/prometheus/data"
        - "{{ ctfd_path }}/loki/data"

    # ── Loki config ─────────────────────────────────────────────────────────────
    # Minimal single-binary filesystem config. Loki is always bound to 127.0.0.1
    # only — never exposed beyond this host — and is only ever reached by:
    #   - the log-proxy sidecar's own `--log-driver=loki` push, which in
    #     split-machine mode runs on the *runner* host and reaches this loopback
    #     address through a persistent reverse SSH tunnel (see below), not a
    #     public/firewalled port;
    #   - Grafana, over the compose network, by container name.
    - name: Write Loki config
      copy:
        content: |
          auth_enabled: false
          server:
            http_listen_port: 3100
          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            # The log-proxy sidecar's own JSON lines can run large (truncated body
            # previews still add up); raise Loki's default per-line/per-stream caps
            # rather than silently dropping entries.
            max_line_size: 256KB
            ingestion_rate_mb: 16
            ingestion_burst_size_mb: 32
        dest: "{{ ctfd_path }}/loki/loki-config.yaml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Loki Docker logging-driver plugin ───────────────────────────────────────
    # Required on whichever host actually runs the log-proxy sidecar's `docker run`/
    # `docker compose up` with `--log-driver=loki`: the primary host in single-machine
    # mode (this play), or the runner host in split-machine mode (separate play below).
    - name: Check if Loki Docker logging-driver plugin is installed
      when: runner_ip is not defined
      command: "{% raw %}docker plugin ls --format '{{.Name}}'{% endraw %}"
      register: docker_plugins_primary
      changed_when: false
      failed_when: false

    - name: Install Loki Docker logging-driver plugin
      when: runner_ip is not defined and 'loki:latest' not in docker_plugins_primary.stdout
      command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      register: loki_plugin_install_primary
      failed_when: loki_plugin_install_primary.rc != 0 and 'already exist' not in loki_plugin_install_primary.stderr

    - name: Ensure Prometheus config directory exists
      file:
        path: "{{ ctfd_path }}/prometheus"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Prometheus scrape config
      copy:
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]
        dest: "{{ ctfd_path }}/prometheus/prometheus.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Ensure Grafana provisioning directory exists
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/datasources"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Grafana Prometheus datasource
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/prometheus.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write Grafana Loki datasource
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki:3100
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/loki.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Grafana dashboards (shipped, not left for the operator to build) ───────
    - name: Ensure Grafana dashboard provisioning directory exists
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/dashboards"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Grafana dashboard provider config
      copy:
        content: |
          apiVersion: 1
          providers:
            - name: NervCTF
              orgId: 1
              folder: ""
              type: file
              disableDeletion: true
              updateIntervalSeconds: 30
              allowUiUpdates: false
              options:
                path: /etc/grafana/provisioning/dashboards
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/dashboards.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write NervCTF host-resources dashboard
      copy:
        content: |
          {
            "title": "NervCTF Host Resources",
            "uid": "nervctf-host-resources",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "CPU usage %",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                    "legendFormat": "CPU"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Memory usage %",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
                    "legendFormat": "Memory"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Disk usage % (root)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"}) * 100)",
                    "legendFormat": "Disk"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Network I/O (bytes/s)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])",
                    "legendFormat": "RX {{ '{{device}}' }}"
                  },
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])",
                    "legendFormat": "TX {{ '{{device}}' }}"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/host-resources.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── NervCTF Player Traffic dashboard (opt-in log_proxy challenges only) ─────
    # Table view, not a raw log panel: parses each sidecar JSON line's fields out
    # with LogQL so the operator sees a method/path/status/duration table instead
    # of a wall of base64. Expand a row's "Line" column for the full JSON (headers +
    # the possibly-truncated body preview — see nervctf-proxy's BODY_LOG_CAP).
    - name: Write NervCTF player-traffic dashboard
      copy:
        content: |
          {
            "title": "NervCTF Player Traffic",
            "uid": "nervctf-player-traffic",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "templating": {
              "list": [
                {
                  "name": "challenge",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(challenge)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "team_id",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(team_id)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "title": "Requests",
                "type": "table",
                "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
                "datasource": { "type": "loki", "uid": "loki" },
                "transformations": [
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": false, "challenge": true, "team_id": true, "Line": true,
                        "tsNs": true, "id": true, "labels": true,
                        "req_headers": true, "resp_headers": true,
                        "req_body_b64": true, "resp_body_b64": true,
                        "req_body_len": true, "resp_body_len": true,
                        "req_body_truncated": true, "resp_body_truncated": true,
                        "ts_ms": true
                      },
                      "indexByName": { "Time": 0, "method": 1, "path": 2, "status": 3, "duration_ms": 4 },
                      "renameByName": {
                        "method": "Method", "path": "Path", "status": "Status",
                        "duration_ms": "Duration (ms)"
                      }
                    }
                  }
                ],
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "{challenge=~\"$challenge\", team_id=~\"$team_id\"} | json",
                    "queryType": "range"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Raw Container Logs",
                "type": "logs",
                "gridPos": { "h": 12, "w": 24, "x": 0, "y": 16 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "{challenge=~\"$challenge\", team_id=~\"$team_id\"}",
                    "queryType": "range"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/player-traffic.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── docker-compose override (monitor service + CTFd env) ───────────────────
    - name: Write docker-compose override
      when: monitor_token is defined
      copy:
        content: |
          services:
            ctfd:
              environment:
                NERVCTF_MONITOR_URL: "http://remote-monitor:{{ monitor_port }}"
                NERVCTF_MONITOR_TOKEN: {{ monitor_token | to_json }}
          {% if event_name is defined %}
                NERVCTF_EVENT_NAME: {{ event_name | to_json }}
          {% endif %}
          {% if event_description is defined %}
                NERVCTF_EVENT_DESCRIPTION: {{ event_description | to_json }}
          {% endif %}
          {% if user_mode is defined %}
                NERVCTF_USER_MODE: {{ user_mode | to_json }}
          {% endif %}
          {% if admin_user is defined and admin_email is defined and admin_password is defined %}
                NERVCTF_ADMIN_USER: {{ admin_user | to_json }}
                NERVCTF_ADMIN_EMAIL: {{ admin_email | to_json }}
                NERVCTF_ADMIN_PASSWORD: {{ admin_password | to_json }}
          {% endif %}

            remote-monitor:
              image: nervctf-monitor:latest
              restart: unless-stopped
              environment:
                - CTFD_DB_URL={{ ctfd_db_url }}
                - MONITOR_TOKEN={{ monitor_token }}
                - PUBLIC_HOST={{ runner_domain | default(runner_ip) | default(ansible_host) }}
                - MONITOR_PORT={{ monitor_port }}
                - DB_PATH={{ ctfd_path }}/remote-monitor/data/monitor.db
          {% if runner_ip is defined %}
                - CHALLENGES_BASE_DIR=/home/{{ runner_user | default('docker') }}/challenges
                - RUNNER_SSH_TARGET={{ runner_user | default('docker') }}@{{ runner_resolved_ip | default(runner_ip) }}
          {% else %}
                - CHALLENGES_BASE_DIR={{ ctfd_path }}/remote-monitor/data/challenges
          {% endif %}
                - CTFD_UPLOADS_DIR={{ ctfd_path }}/.data/CTFd/uploads
                # Always loopback: the push happens in the network namespace of
                # whichever Docker daemon actually runs the instance's containers
                # (this host in single-machine mode; the runner host in split-
                # machine mode, where the reverse SSH tunnel below makes its own
                # 127.0.0.1:3100 reach this host's Loki). Never a public/firewalled
                # address — see docker.rs::loki_log_args. Every instance container
                # ships here, not just log_proxy-enabled HTTP sidecars.
                - LOKI_URL=http://127.0.0.1:3100/loki/api/v1/push
                - MAX_CONCURRENT_PROVISIONS={{ max_concurrent_provisions }}
                - MAX_INSTANCES_PER_TEAM={{ max_instances_per_team }}
          {% if ctfd_domain is defined and ctfd_domain %}
                - CTFD_DOMAIN={{ ctfd_domain }}
          {% endif %}
              networks:
                - default
                - internal
              volumes:
          {% if runner_ip is defined %}
                - {{ ctfd_path }}/remote-monitor/monitor_ssh_key:/run/monitor_ssh_key:ro
          {% else %}
                - /var/run/docker.sock:/var/run/docker.sock
                - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
                - /tmp/ctf-flags:/tmp/ctf-flags
          {% endif %}
                - {{ ctfd_path }}/remote-monitor/data:{{ ctfd_path }}/remote-monitor/data
                - {{ ctfd_path }}/.data/CTFd/uploads:{{ ctfd_path }}/.data/CTFd/uploads
              ports:
                - "{{ monitor_port }}:{{ monitor_port }}"

            # Prometheus/node-exporter/Grafana: always-on host resource monitoring
            # (CPU/RAM/disk/network for the CTFd host). node-exporter is reached only
            # by Prometheus over the compose network, never published to the host.
            prometheus:
              image: prom/prometheus:latest
              restart: unless-stopped
              networks:
                - default
              volumes:
                - {{ ctfd_path }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - {{ ctfd_path }}/prometheus/data:/prometheus
              # Loopback-only, unconditionally: Prometheus only scrapes node-exporter
              # and is only read by Grafana — both always on this same host, over the
              # compose network. No cross-host case needs port 9090 published beyond
              # localhost.
              ports:
                - "127.0.0.1:9090:9090"

            node-exporter:
              image: prom/node-exporter:latest
              restart: unless-stopped
              networks:
                - default
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - --path.procfs=/host/proc
                - --path.sysfs=/host/sys
                - --path.rootfs=/rootfs
                - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)

            # Loki: stores player-traffic JSON lines shipped by opt-in `log_proxy`
            # sidecars (see docker.rs::loki_log_args / compose.rs::up). Loopback-only,
            # unconditionally — never exposed beyond this host; reached only by the
            # log-proxy sidecar's own push (via loopback directly, or via the reverse
            # SSH tunnel in split-machine mode) and by Grafana over the compose network.
            loki:
              # Pinned, not :latest: grafana/loki 3.7.x's single-binary ingester has a
              # reproducible bug against this minimal config — it reports /ready and
              # ring state ACTIVE, but every push 500s forever with "Ingester is
              # shutting down", even against a freshly wiped data dir. 2.9.x does not
              # have this problem (verified: HTTP 204 on push vs the 500 from latest).
              image: grafana/loki:2.9.10
              restart: unless-stopped
              networks:
                - default
              volumes:
                - {{ ctfd_path }}/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
                - {{ ctfd_path }}/loki/data:/loki
              ports:
                - "127.0.0.1:3100:3100"

            grafana:
              image: grafana/grafana:latest
              restart: unless-stopped
              networks:
                - default
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD={{ monitor_token }}
                - GF_AUTH_ANONYMOUS_ENABLED=false
              volumes:
                - {{ ctfd_path }}/grafana/data:/var/lib/grafana
                - {{ ctfd_path }}/grafana/provisioning:/etc/grafana/provisioning:ro
              ports:
          {% if runner_ip is defined %}
                - "3000:3000"
          {% else %}
                - "127.0.0.1:3000:3000"
          {% endif %}
              depends_on:
                - prometheus
                - loki

          # Explicitly declare the networks used by remote-monitor so Docker Compose
          # correctly joins it to the existing project networks (not creating new ones).
          # Without this, a service added only in an override may not be attached to
          # networks defined solely in the base docker-compose.yml.
          networks:
            default: {}
            internal: {}
        dest: "{{ ctfd_path }}/docker-compose.override.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0640"

    # ── CTFd start (first-run only) ────────────────────────────────────────────
    # By this point the nervctf-monitor:latest image is already built and the
    # override file is written, so docker compose will not try to pull the image.
    - name: Check if CTFd containers are running
      shell: docker compose -f {{ ctfd_path }}/docker-compose.yml ps --status running 2>/dev/null | grep -q ctfd
      register: ctfd_running
      changed_when: false
      ignore_errors: yes
      become_user: "{{ docker_user }}"

    - name: Start CTFd
      command:
        cmd: docker compose up --build --detach --no-recreate
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"
      when: ctfd_running.rc != 0

    - name: Apply docker-compose override (recreate CTFd, start monitor)
      command:
        cmd: docker compose up -d --force-recreate
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"
      when: plugin_src is defined or monitor_token is defined

    # CTFd's front-end is frequently published on a non-80 host port (e.g. nginx
    # on 8080), so resolve the published port from Compose rather than assuming
    # localhost:80. Prefer the ctfd/gunicorn mapping (8000), fall back to nginx.
    - name: Resolve CTFd's published HTTP port
      shell: |
        port="$(docker compose -f {{ ctfd_path }}/docker-compose.yml port ctfd 8000 2>/dev/null | sed 's/.*://')"
        if [ -z "$port" ]; then
          port="$(docker compose -f {{ ctfd_path }}/docker-compose.yml port nginx 80 2>/dev/null | sed 's/.*://')"
        fi
        echo "${port:-80}"
      register: ctfd_http_port
      changed_when: false
      become_user: "{{ docker_user }}"

    # Wait for CTFd's gunicorn workers to finish db.create_all() / Alembic migrations.
    # A non-502/503 HTTP response means at least one gunicorn worker has completed its
    # create_app() call and the schema is ready.
    - name: Wait for CTFd to finish database initialization
      uri:
        url: "http://localhost:{{ ctfd_http_port.stdout | trim }}/"
        status_code: [200, 301, 302, 401, 403]
        follow_redirects: no
        timeout: 10
      register: ctfd_init_result
      until: ctfd_init_result.status is defined and ctfd_init_result.status in [200, 301, 302, 401, 403]
      retries: 60
      delay: 5
      ignore_errors: yes

    - name: Report CTFd initialization result
      debug:
        msg: >-
          {{
            'CTFd is ready (HTTP ' ~ ctfd_init_result.status ~ ').'
            if (ctfd_init_result.status is defined and ctfd_init_result.status in [200, 301, 302, 401, 403])
            else 'WARNING: CTFd did not respond in time. If nervctf deploy fails with a database error, wait a moment and retry.'
          }}

    - name: Wait for monitor health endpoint
      uri:
        url: "http://localhost:{{ monitor_port | default('33133') }}/health"
        status_code: 200
      register: health_result
      until: health_result.status == 200
      retries: 30
      delay: 2
      ignore_errors: yes

    - name: Report health check result
      debug:
        msg: "{{ 'Monitor is healthy!' if health_result.status == 200 else 'WARNING: Monitor health check failed after 60s. Check docker logs.' }}"

# ── Runner: separate machine for challenge containers (split-machine mode) ────
- hosts: runner
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"

  tasks:
    # ── Docker ─────────────────────────────────────────────────────────────────
    - name: Check if Docker is installed
      command: docker --version
      register: docker_installed
      changed_when: false
      ignore_errors: yes

    - name: Install Docker
      when: docker_installed.rc != 0
      block:
        - name: Install apt prerequisites
          apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: yes

        - name: Create keyring directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
            force: no

        - name: Add Docker apt repository
          apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present
            update_cache: yes

        - name: Install Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    # ── Docker daemon config ───────────────────────────────────────────────────
    - name: Write Docker daemon config (expanded address pool + BuildKit)
      copy:
        content: |
          {
            "default-address-pools": [
              {"base": "172.16.0.0/12", "size": 24}
            ],
            "features": {"buildkit": true}
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      register: docker_daemon_json_runner

    - name: Restart Docker daemon if config changed
      systemd:
        name: docker
        state: restarted
      when: docker_daemon_json_runner.changed

    # ── Docker user ────────────────────────────────────────────────────────────
    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Ensure docker user exists
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
        shell: /bin/bash
        state: present
        create_home: yes

    # ── SSH server ─────────────────────────────────────────────────────────────
    - name: Ensure openssh-server is installed
      apt:
        name: openssh-server
        state: present

    - name: Ensure SSH service is running
      systemd:
        name: ssh
        state: started
        enabled: yes

    # ── Ensure runner SSH user can run Docker ─────────────────────────────────
    # root already has full access; for other users, docker group membership is required.
    - name: Ensure runner_user is in docker group
      user:
        name: "{{ runner_user | default(docker_user) }}"
        groups: docker
        append: yes
      when: (runner_user | default(docker_user)) != 'root'

    # ── Authorize remote-monitor's SSH public key ──────────────────────────────
    - name: Authorize remote-monitor SSH public key
      authorized_key:
        user: "{{ runner_user | default(docker_user) }}"
        state: present
        key: "{{ hostvars[groups['ctfd'][0]]['monitor_pubkey'] }}"

    # ── Challenges directory (where compose challenge sources are stored) ──────
    - name: Create challenges directory on runner
      file:
        path: /home/{{ runner_user | default(docker_user) }}/challenges
        state: directory
        owner: "{{ runner_user | default(docker_user) }}"
        group: docker
        mode: "0755"

    # ── Loki Docker logging-driver plugin (runner side) ────────────────────────
    # This host is where `docker run`/`docker compose up --log-driver=loki` for
    # the log-proxy sidecar actually executes in split-machine mode — see the
    # matching primary-host task for why this plugin (not core Docker) is needed.
    - name: Check if Loki Docker logging-driver plugin is installed on runner
      command: "{% raw %}docker plugin ls --format '{{.Name}}'{% endraw %}"
      register: docker_plugins_runner
      changed_when: false
      failed_when: false

    - name: Install Loki Docker logging-driver plugin on runner
      when: "'loki:latest' not in docker_plugins_runner.stdout"
      command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      register: loki_plugin_install_runner
      failed_when: loki_plugin_install_runner.rc != 0 and 'already exist' not in loki_plugin_install_runner.stderr

# ── Reverse SSH tunnel: primary → runner (split-machine mode only) ────────────
# Makes the runner's dockerd (which does the actual `--log-driver=loki` push,
# from its own host network namespace — not the per-instance container's netns)
# reach Loki on the primary host via plain loopback, exactly as it would in
# single-machine mode. No firewall changes, no public exposure of Loki: this
# rides the same monitor_ssh_key trust already established above. Must run
# after the runner play above (which authorizes that key on the runner) and
# after `monitor_ssh_key` exists on the primary (generated earlier in this file).
- hosts: ctfd
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"
  tasks:
    - name: Install autossh (split-machine Loki tunnel)
      when: runner_ip is defined
      apt:
        name: autossh
        state: present
        update_cache: yes

    - name: Write systemd unit for primary→runner Loki reverse tunnel
      when: runner_ip is defined
      copy:
        content: |
          [Unit]
          Description=NervCTF: reverse-forward Loki (3100) to the runner over SSH
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i {{ ctfd_path }}/remote-monitor/monitor_ssh_key \
            -R 3100:127.0.0.1:3100 \
            {{ runner_user | default('docker') }}@{{ runner_resolved_ip | default(runner_ip) }}
          Restart=always
          RestartSec=5
          User={{ docker_user }}

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/nervctf-loki-tunnel.service
        mode: "0644"
      register: loki_tunnel_unit

    - name: Enable and (re)start the Loki reverse-tunnel service
      when: runner_ip is defined
      systemd:
        name: nervctf-loki-tunnel
        daemon_reload: "{{ loki_tunnel_unit.changed }}"
        enabled: yes
        state: "{{ 'restarted' if loki_tunnel_unit.changed else 'started' }}"
