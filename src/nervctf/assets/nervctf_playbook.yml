          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/host-resources.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── NervCTF Container Logs dashboard ───────────────────────────────────────
    # Was "Player Traffic", built around nervctf-proxy's per-request JSON lines. The
    # tap that replaces the proxy writes raw byte streams to disk, not to Loki, so the
    # old `| json | status >= 400` and `unwrap duration_ms` panels referenced fields
    # that no longer exist anywhere and would render permanently empty.
    #
    # What Loki genuinely holds is every instance container's stdout/stderr, labelled
    # by challenge/team — which is log-shaped, so that is all this dashboard claims to
    # show. Request/response inspection is a session-browsing problem and belongs in
    # remote-monitor's admin UI, over the tap's capture files.
    - name: Write NervCTF container-logs dashboard
      copy:
        content: |
          {
            "title": "NervCTF Container Logs",
            "uid": "nervctf-container-logs",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "templating": {
              "list": [
                {
                  "name": "challenge",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(challenge)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "team_id",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(team_id)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "team_name",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(team_name)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "search",
                  "type": "textbox",
                  "label": "Filter (substring)",
                  "query": "",
                  "current": { "text": "", "value": "" }
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "title": "What this shows",
                "type": "text",
                "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
                "options": {
                  "mode": "markdown",
                  "content": "Container **stdout/stderr** for every instance, labelled by challenge and team. This is whatever the challenge itself printed \u2014 many challenges (nc, pwn) print nothing.\n\nFor what players actually **sent and received**, use the tap's capture files via remote-monitor's admin UI; those bytes are deliberately not shipped here."
                }
              },
              {
                "id": 2,
                "title": "Instance Logs",
                "type": "logs",
                "gridPos": { "h": 15, "w": 24, "x": 0, "y": 3 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": {
                  "showTime": true,
                  "showLabels": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "{challenge=~\"$challenge\", team_id=~\"$team_id\", team_name=~\"$team_name\"} |= \"$search\"",
                    "queryType": "range"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Log Volume by Challenge",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "sum by (challenge) (count_over_time({challenge=~\"$challenge\", team_id=~\"$team_id\", team_name=~\"$team_name\"}[$__interval]))",
                    "queryType": "range"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Loudest Teams (lines)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "topk(10, sum by (team_name) (count_over_time({challenge=~\"$challenge\", team_id=~\"$team_id\", team_name=~\"$team_name\"}[$__interval])))",
                    "queryType": "range"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/container-logs.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # Remove the superseded dashboard so Grafana stops provisioning panels that query
    # nervctf-proxy fields no longer produced by anything.
    - name: Remove superseded player-traffic dashboard
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/dashboards/player-traffic.json"
        state: absent

    # Team-mode only — CTFd user-mode deployments (submissions.team_id is always NULL
    # there) would need the users-joined variants documented in ctfd_db.rs's user-mode
    # comments (detect_ctfd_mode/sync_solves/recompute_instance_decay) instead; not
    # built here since this deployment's events have all been team-mode so far.
    - name: Write NervCTF scoreboard dashboard
      copy:
        content: |
          {
            "title": "NervCTF Scoreboard",
            "uid": "nervctf-scoreboard",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "Team-mode only",
                "type": "text",
                "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
                "options": {
                  "mode": "markdown",
                  "content": "This dashboard assumes CTFd team-mode. A user-mode deployment (`submissions.team_id` is always NULL there) will show empty panels — see the user-mode comments in `ctfd_db.rs` for the join pattern a user-mode variant would need."
                }
              },
              {
                "id": 2,
                "title": "Cumulative Solves Over Time",
                "type": "timeseries",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 3 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT s.date AS time, t.name AS metric, COUNT(*) OVER (PARTITION BY t.id ORDER BY s.date) AS value FROM submissions s JOIN teams t ON t.id = s.team_id WHERE s.type = 'correct' AND t.hidden = 0 AND t.banned = 0 AND $__timeFilter(s.date) ORDER BY s.date",
                    "format": "time_series",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 3,
                "title": "First Blood",
                "type": "table",
                "gridPos": { "h": 10, "w": 12, "x": 0, "y": 13 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, t.name AS first_blood_team, first.ts AS solved_at FROM (SELECT challenge_id, team_id, MIN(date) AS ts FROM submissions WHERE type = 'correct' GROUP BY challenge_id) first JOIN challenges c ON c.id = first.challenge_id JOIN teams t ON t.id = first.team_id WHERE t.hidden = 0 AND t.banned = 0 ORDER BY first.ts ASC",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 4,
                "title": "Challenge Difficulty",
                "type": "table",
                "gridPos": { "h": 10, "w": 12, "x": 12, "y": 13 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, c.value AS current_value, COUNT(DISTINCT s.team_id) AS solves, (SELECT COUNT(*) FROM teams WHERE hidden = 0 AND banned = 0) AS total_teams, ROUND(100.0 * COUNT(DISTINCT s.team_id) / NULLIF((SELECT COUNT(*) FROM teams WHERE hidden = 0 AND banned = 0), 0), 1) AS solve_rate_pct FROM challenges c LEFT JOIN submissions s ON s.challenge_id = c.id AND s.type = 'correct' LEFT JOIN teams t ON t.id = s.team_id AND t.hidden = 0 AND t.banned = 0 GROUP BY c.id, c.name, c.value ORDER BY solve_rate_pct ASC",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/scoreboard.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

