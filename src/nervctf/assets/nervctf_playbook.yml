        group: docker
        mode: "0644"

    # ── External reverse proxy (external_proxy) ───────────────────────────────
    # CTFd's upstream docker-compose.yml ships an `nginx` service bound to :80. On a
    # host that already terminates HTTP(S) itself — an apt-installed nginx holding the
    # TLS certificate, say — that service loses the bind and fails the whole
    # `compose up`, taking the rest of the stack (Grafana included) down with it.
    #
    # Probed against the BASE compose file only, never the override this play writes:
    # a fork that has already removed the service must not have one re-added, since a
    # service with nothing but `profiles:` is a compose config error.
    - name: Check whether CTFd's compose file defines an nginx service
      command: docker compose -f {{ ctfd_path }}/docker-compose.yml config --services
      register: ctfd_compose_services
      changed_when: false
      failed_when: false

    - name: Record whether CTFd ships its own nginx
      set_fact:
        ctfd_has_nginx: "{{ 'nginx' in (ctfd_compose_services.stdout_lines | default([])) }}"

    # ── docker-compose override (monitor service + CTFd env) ───────────────────
    - name: Write docker-compose override
      when: monitor_token is defined
      copy:
        content: |
          services:
            ctfd:
              environment:
                NERVCTF_MONITOR_URL: "http://remote-monitor:{{ monitor_port }}"
                NERVCTF_MONITOR_TOKEN: {{ monitor_token | to_json }}
          {% if event_name is defined %}
                NERVCTF_EVENT_NAME: {{ event_name | to_json }}
          {% endif %}
          {% if event_description is defined %}
                NERVCTF_EVENT_DESCRIPTION: {{ event_description | to_json }}
          {% endif %}
          {% if user_mode is defined %}
                NERVCTF_USER_MODE: {{ user_mode | to_json }}
          {% endif %}
          {% if admin_user is defined and admin_email is defined and admin_password is defined %}
                NERVCTF_ADMIN_USER: {{ admin_user | to_json }}
                NERVCTF_ADMIN_EMAIL: {{ admin_email | to_json }}
                NERVCTF_ADMIN_PASSWORD: {{ admin_password | to_json }}
          {% endif %}

            remote-monitor:
              image: nervctf-monitor:latest
              restart: unless-stopped
              environment:
                - CTFD_DB_URL={{ ctfd_db_url }}
                - MONITOR_TOKEN={{ monitor_token }}
                - PUBLIC_HOST={{ runner_domain | default(runner_ip) | default(ansible_host) }}
                - MONITOR_PORT={{ monitor_port }}
                - DB_PATH={{ ctfd_path }}/remote-monitor/data/monitor.db
          {% if runner_ip is defined %}
                - CHALLENGES_BASE_DIR=/home/{{ runner_user | default('docker') }}/challenges
                - RUNNER_SSH_TARGET={{ runner_user | default('docker') }}@{{ runner_resolved_ip | default(runner_ip) }}
          {% else %}
                - CHALLENGES_BASE_DIR={{ ctfd_path }}/remote-monitor/data/challenges
          {% endif %}
                - CTFD_UPLOADS_DIR={{ ctfd_path }}/.data/CTFd/uploads
                # Always loopback: the push happens in the network namespace of
                # whichever Docker daemon actually runs the instance's containers
                # (this host in single-machine mode; the runner host in split-
                # machine mode, where the reverse SSH tunnel below makes its own
                # 127.0.0.1:3100 reach this host's Loki). Never a public/firewalled
                # address — see docker.rs::loki_log_args. Every instance container
                # ships here, not just log_proxy-enabled HTTP sidecars.
                - LOKI_URL=http://127.0.0.1:3100/loki/api/v1/push
                # Host directory the tap sidecars write captures into. In split-machine
                # mode the files land on the *runner*, so this path is only readable by
                # the monitor in single-machine mode; reading them over SSH is not wired
                # up yet.
                - CAPTURE_BASE_DIR=/var/lib/nervctf-captures
                - MAX_CONCURRENT_PROVISIONS={{ max_concurrent_provisions }}
                - MAX_INSTANCES_PER_TEAM={{ max_instances_per_team }}
          {% if ctfd_domain is defined and ctfd_domain %}
                - CTFD_DOMAIN={{ ctfd_domain }}
          {% endif %}
              networks:
                - default
                - internal
              volumes:
          {% if runner_ip is defined %}
                - {{ ctfd_path }}/remote-monitor/monitor_ssh_key:/run/monitor_ssh_key:ro
          {% else %}
                - /var/run/docker.sock:/var/run/docker.sock
                - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
                - /tmp/ctf-flags:/tmp/ctf-flags
                # Read-write, not :ro — the monitor creates the per-instance
                # subdirectory before launching a tap sidecar. Mounted read-only,
                # that create_dir_all failed with EROFS and took the whole
                # provision down with it.
                - /var/lib/nervctf-captures:/var/lib/nervctf-captures
          {% endif %}
                - {{ ctfd_path }}/remote-monitor/data:{{ ctfd_path }}/remote-monitor/data
                - {{ ctfd_path }}/.data/CTFd/uploads:{{ ctfd_path }}/.data/CTFd/uploads
              ports:
                - "{{ monitor_port }}:{{ monitor_port }}"

            # Prometheus/node-exporter/Grafana: always-on host resource monitoring
            # (CPU/RAM/disk/network for the CTFd host). node-exporter is reached only
            # by Prometheus over the compose network, never published to the host.
            prometheus:
              image: prom/prometheus:latest
              restart: unless-stopped
              networks:
                - default
              volumes:
                - {{ ctfd_path }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - {{ ctfd_path }}/prometheus/data:/prometheus
              # Loopback-only, unconditionally: Prometheus only scrapes node-exporter
              # and is only read by Grafana — both always on this same host, over the
              # compose network. No cross-host case needs port 9090 published beyond
              # localhost.
              ports:
                - "127.0.0.1:9090:9090"

            node-exporter:
              image: prom/node-exporter:latest
              restart: unless-stopped
              networks:
                - default
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - --path.procfs=/host/proc
                - --path.sysfs=/host/sys
                - --path.rootfs=/rootfs
                - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)

            # Loki: stores player-traffic JSON lines shipped by opt-in `log_proxy`
            # sidecars (see docker.rs::loki_log_args / compose.rs::up). Loopback-only,
            # unconditionally — never exposed beyond this host; reached only by the
            # log-proxy sidecar's own push (via loopback directly, or via the reverse
            # SSH tunnel in split-machine mode) and by Grafana over the compose network.
            loki:
              # Pinned, not :latest: grafana/loki 3.7.x's single-binary ingester has a
              # reproducible bug against this minimal config — it reports /ready and
              # ring state ACTIVE, but every push 500s forever with "Ingester is
              # shutting down", even against a freshly wiped data dir. 2.9.x does not
              # have this problem (verified: HTTP 204 on push vs the 500 from latest).
              image: grafana/loki:2.9.10
              restart: unless-stopped
              networks:
                - default
              volumes:
                - {{ ctfd_path }}/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
                - {{ ctfd_path }}/loki/data:/loki
              ports:
                - "127.0.0.1:3100:3100"

            grafana:
              image: grafana/grafana:latest
              restart: unless-stopped
              networks:
                - default
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD={{ monitor_token }}
                - GF_AUTH_ANONYMOUS_ENABLED=false
                - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
              volumes:
                - {{ ctfd_path }}/grafana/data:/var/lib/grafana
                - {{ ctfd_path }}/grafana/provisioning:/etc/grafana/provisioning:ro
              ports:
          {% if runner_ip is defined %}
                - "3000:3000"
          {% else %}
                - "127.0.0.1:3000:3000"
          {% endif %}
              depends_on:
                - prometheus
                - loki

          {% if external_proxy | default(false) | bool and ctfd_has_nginx | default(false) | bool %}
            # external_proxy: true — the host terminates HTTP(S), so CTFd's bundled
            # nginx must not compete for :80. A compose profile leaves the service
            # defined but never started; `--remove-orphans` on the up below reaps any
            # container an earlier run already created. nervctf deliberately does not
            # touch CTFd's own port mappings — point the host proxy at CTFd's published
            # port (8000 by default). See docs/remote-monitor.md.
            nginx:
              profiles: ["nervctf-disabled"]
          {% endif %}
          # Explicitly declare the networks used by remote-monitor so Docker Compose
          # correctly joins it to the existing project networks (not creating new ones).
          # Without this, a service added only in an override may not be attached to
          # networks defined solely in the base docker-compose.yml.
          networks:
            default: {}
            internal: {}
        dest: "{{ ctfd_path }}/docker-compose.override.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0640"

    # ── CTFd start (first-run only) ────────────────────────────────────────────
    # By this point the nervctf-monitor:latest image is already built and the
    # override file is written, so docker compose will not try to pull the image.
    - name: Check if CTFd containers are running
      shell: docker compose -f {{ ctfd_path }}/docker-compose.yml ps --status running 2>/dev/null | grep -q ctfd
      register: ctfd_running
      changed_when: false
      ignore_errors: yes
      become_user: "{{ docker_user }}"

    - name: Start CTFd
      command:
        cmd: docker compose up --build --detach --no-recreate
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"
      when: ctfd_running.rc != 0

    - name: Apply docker-compose override (recreate CTFd, start monitor)
      command:
        cmd: docker compose up -d --force-recreate --remove-orphans
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"
      when: plugin_src is defined or monitor_token is defined

    # CTFd's front-end is frequently published on a non-80 host port (e.g. nginx
    # on 8080), so resolve the published port from Compose rather than assuming
    # localhost:80. Prefer the ctfd/gunicorn mapping (8000), fall back to nginx.
    - name: Resolve CTFd's published HTTP port
      shell: |
        port="$(docker compose -f {{ ctfd_path }}/docker-compose.yml port ctfd 8000 2>/dev/null | sed 's/.*://')"
        if [ -z "$port" ]; then
          port="$(docker compose -f {{ ctfd_path }}/docker-compose.yml port nginx 80 2>/dev/null | sed 's/.*://')"
        fi
        echo "${port:-80}"
      register: ctfd_http_port
      changed_when: false
      become_user: "{{ docker_user }}"

    # Wait for CTFd's gunicorn workers to finish db.create_all() / Alembic migrations.
    # Any routed HTTP response means at least one gunicorn worker has completed its
    # create_app() call and the schema is ready; only a connection error or a
    # 502/503 from the proxy means it is still booting.
    #
    # Probe /setup, not /: /setup answers 200 before first-run setup and 302 once
    # `setup` is true, so it is routed in both states. / is served from the Pages
    # table and answers 404 on a freshly set-up instance that has no index page
    # yet, which used to stall this loop for all 60 retries even though CTFd was
    # up.
    #
    # 404 is deliberately NOT accepted. /setup is a registered route in every
    # state, so a 404 means something other than CTFd answered: the port lookup
    # above falls back to 80 when `docker compose port` comes back empty, and a
    # host nginx on :80 returns 404 here. Accepting it would report "ready"
    # against the wrong server and push the real failure into `nervctf deploy`.
    - name: Wait for CTFd to finish database initialization
      uri:
        url: "http://localhost:{{ ctfd_http_port.stdout | trim }}/setup"
        status_code: [200, 301, 302, 401, 403]
        follow_redirects: no
        timeout: 10
      register: ctfd_init_result
      until: ctfd_init_result.status is defined and ctfd_init_result.status in [200, 301, 302, 401, 403]
      retries: 60
      delay: 5
      ignore_errors: yes

    - name: Report CTFd initialization result
      debug:
        msg: >-
          {{
            'CTFd is ready (HTTP ' ~ ctfd_init_result.status ~ ').'
            if (ctfd_init_result.status is defined and ctfd_init_result.status in [200, 301, 302, 401, 403])
            else 'WARNING: CTFd did not respond in time. If nervctf deploy fails with a database error, wait a moment and retry.'
          }}

    - name: Wait for monitor health endpoint
      uri:
        url: "http://localhost:{{ monitor_port | default('33133') }}/health"
        status_code: 200
      register: health_result
      until: health_result.status == 200
      retries: 30
      delay: 2
      ignore_errors: yes

    - name: Report health check result
      debug:
        msg: "{{ 'Monitor is healthy!' if health_result.status == 200 else 'WARNING: Monitor health check failed after 60s. Check docker logs.' }}"

# ── Runner: separate machine for challenge containers (split-machine mode) ────
- hosts: runner
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"

  tasks:
    # ── Docker ─────────────────────────────────────────────────────────────────
    - name: Check if Docker is installed
      command: docker --version
      register: docker_installed
      changed_when: false
      ignore_errors: yes

    - name: Install Docker
      when: docker_installed.rc != 0
      block:
        - name: Install apt prerequisites
          apt:
            name: [ca-certificates, curl]
            state: present
            update_cache: yes

        - name: Create keyring directory
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker GPG key
          get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
            force: no

        - name: Add Docker apt repository
          apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present
            update_cache: yes

        - name: Install Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

    # ── Docker daemon config ───────────────────────────────────────────────────
    - name: Write Docker daemon config (expanded address pool + BuildKit)
      copy:
        content: |
          {
            "default-address-pools": [
              {"base": "172.16.0.0/12", "size": 24}
            ],
            "features": {"buildkit": true}
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      register: docker_daemon_json_runner

    - name: Restart Docker daemon if config changed
      systemd:
        name: docker
        state: restarted
      when: docker_daemon_json_runner.changed

    # ── Docker user ────────────────────────────────────────────────────────────
    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Look up the docker user's current login shell
      getent:
        database: passwd
        key: "{{ docker_user }}"
        fail_key: false
      register: docker_user_passwd
      changed_when: false

    # `shell:` is deliberately conditional rather than a hardcoded /bin/bash. The
    # `user` module enforces whatever it is given on *every* run, so hardcoding it
    # rewrote the login shell of an already-existing account each time `nervctf setup`
    # ran — and since `docker_user` defaults to `ansible_user`, on a single-machine
    # deployment that is usually root, whose shell the operator may well have changed
    # on purpose. Preserve whatever the account already uses; only pick a default when
    # this run is actually creating the account.
    - name: Ensure docker user exists
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
        state: present
        create_home: yes
        shell: >-
          {{ (docker_user_passwd.ansible_facts.getent_passwd | default({})).get(docker_user)[5]
             if (docker_user_passwd.ansible_facts.getent_passwd | default({})).get(docker_user)
             else '/bin/bash' }}

    # ── SSH server ─────────────────────────────────────────────────────────────
    - name: Ensure openssh-server is installed
      apt:
        name: openssh-server
        state: present

    - name: Ensure SSH service is running
      systemd:
        name: ssh
        state: started
        enabled: yes

    # ── Ensure runner SSH user can run Docker ─────────────────────────────────
    # root already has full access; for other users, docker group membership is required.
    - name: Ensure runner_user is in docker group
      user:
        name: "{{ runner_user | default(docker_user) }}"
        groups: docker
        append: yes
      when: (runner_user | default(docker_user)) != 'root'

    # ── Authorize remote-monitor's SSH public key ──────────────────────────────
    - name: Authorize remote-monitor SSH public key
      authorized_key:
        user: "{{ runner_user | default(docker_user) }}"
        state: present
        key: "{{ hostvars[groups['ctfd'][0]]['monitor_pubkey'] }}"

    # ── Challenges directory (where compose challenge sources are stored) ──────
    - name: Create challenges directory on runner
      file:
        path: /home/{{ runner_user | default(docker_user) }}/challenges
        state: directory
        owner: "{{ runner_user | default(docker_user) }}"
        group: docker
        mode: "0755"

    # ── Loki Docker logging-driver plugin (runner side) ────────────────────────
    # This host is where `docker run`/`docker compose up --log-driver=loki` for
    # the log-proxy sidecar actually executes in split-machine mode — see the
    # matching primary-host task for why this plugin (not core Docker) is needed.
    - name: Check if Loki Docker logging-driver plugin is installed on runner
      command: "{% raw %}docker plugin ls --format '{{.Name}}'{% endraw %}"
      register: docker_plugins_runner
      changed_when: false
      failed_when: false

    - name: Install Loki Docker logging-driver plugin on runner
      when: "'loki:latest' not in docker_plugins_runner.stdout"
      command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      register: loki_plugin_install_runner
      failed_when: loki_plugin_install_runner.rc != 0 and 'already exist' not in loki_plugin_install_runner.stderr

    # ── nervctf-tap image (runner side) ───────────────────────────────────────
    # Split-machine mode runs challenge containers — and therefore the tap sidecar —
    # on THIS host, so the image has to exist here. The nervctf-proxy image this
    # replaces was only ever built on the primary host, so a split-machine deployment
    # that opted into log_proxy would have failed with "image not found".
    - name: Ensure nervctf-tap directory exists on runner
      file:
        path: /opt/nervctf/tap
        state: directory
        mode: "0755"
      when: tap_binary is defined

    - name: Copy nervctf-tap binary to runner
      copy:
        src: "{{ tap_binary }}"
        dest: /opt/nervctf/tap/nervctf-tap
        mode: "0755"
      when: tap_binary is defined

    - name: Write nervctf-tap Dockerfile on runner
      copy:
        content: |
          FROM debian:bookworm-slim
          COPY nervctf-tap /usr/local/bin/nervctf-tap
          ENTRYPOINT ["/usr/local/bin/nervctf-tap"]
        dest: /opt/nervctf/tap/Dockerfile
        mode: "0644"
      when: tap_binary is defined

    - name: Build nervctf-tap Docker image on runner
      command: docker build -t nervctf-tap:latest /opt/nervctf/tap
      when: tap_binary is defined

    - name: Ensure nervctf capture directory exists on runner
      file:
        path: /var/lib/nervctf-captures
        state: directory
        mode: "0777"

# ── Reverse SSH tunnel: primary → runner (split-machine mode only) ────────────
# Makes the runner's dockerd (which does the actual `--log-driver=loki` push,
# from its own host network namespace — not the per-instance container's netns)
# reach Loki on the primary host via plain loopback, exactly as it would in
# single-machine mode. No firewall changes, no public exposure of Loki: this
# rides the same monitor_ssh_key trust already established above. Must run
# after the runner play above (which authorizes that key on the runner) and
# after `monitor_ssh_key` exists on the primary (generated earlier in this file).
- hosts: ctfd
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"
  tasks:
    - name: Install autossh (split-machine Loki tunnel)
      when: runner_ip is defined
      apt:
        name: autossh
        state: present
        update_cache: yes

    - name: Write systemd unit for primary→runner Loki reverse tunnel
      when: runner_ip is defined
      copy:
        content: |
          [Unit]
          Description=NervCTF: reverse-forward Loki (3100) to the runner over SSH
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i {{ ctfd_path }}/remote-monitor/monitor_ssh_key \
            -R 3100:127.0.0.1:3100 \
            {{ runner_user | default('docker') }}@{{ runner_resolved_ip | default(runner_ip) }}
          Restart=always
          RestartSec=5
          User={{ docker_user }}

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/nervctf-loki-tunnel.service
        mode: "0644"
      register: loki_tunnel_unit

    - name: Enable and (re)start the Loki reverse-tunnel service
      when: runner_ip is defined
      systemd:
        name: nervctf-loki-tunnel
        daemon_reload: "{{ loki_tunnel_unit.changed }}"
        enabled: yes
        state: "{{ 'restarted' if loki_tunnel_unit.changed else 'started' }}"
