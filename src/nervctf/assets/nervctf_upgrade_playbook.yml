---
# NervCTF upgrade playbook — updates an existing deployment without reinstalling infrastructure.
# Upgrades: CTFd plugin, remote-monitor binary, Docker image, restarts affected containers.
# Assumes Docker, CTFd, and the monitor service are already running.
#
# NervCTF tested CTFd version: 3.7.3
# The version-check tasks below detect drift. If CTFd has been updated beyond
# 3.7.3, run 'nervctf probe' after this playbook to get a full compatibility report.
- hosts: ctfd
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"
    monitor_port: "{{ monitor_port | default('33133') }}"

  tasks:
    # ── CTFd version check ─────────────────────────────────────────────────────
    - name: Read installed CTFd git tag
      command: git -C "{{ ctfd_path }}" describe --tags --exact-match
      register: ctfd_installed_tag
      ignore_errors: true
      changed_when: false

    - name: Warn if CTFd version has drifted from tested version
      debug:
        msg: >
          WARNING: Installed CTFd version is '{{ ctfd_installed_tag.stdout | trim }}'.
          NervCTF is tested against 3.7.3. Schema assumptions may not hold.
          After this upgrade, run 'nervctf probe' to verify compatibility.
      when:
        - ctfd_installed_tag.rc == 0
        - ctfd_installed_tag.stdout | trim != '3.7.3'

    - name: Note if CTFd version could not be determined
      debug:
        msg: >
          WARNING: Could not read CTFd git tag (rc={{ ctfd_installed_tag.rc }}).
          The installed CTFd version cannot be verified. Proceeding anyway.
          Run 'nervctf probe' after upgrade to check compatibility.
      when: ctfd_installed_tag.rc != 0

    # ── CTFd Plugin ────────────────────────────────────────────────────────────
    - name: Ensure CTFd plugins directory exists
      file:
        path: "{{ ctfd_path }}/CTFd/plugins/nervctf_instance"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: plugin_src is defined

    - name: Sync updated plugin files
      synchronize:
        src: "{{ plugin_src }}/"
        dest: "{{ ctfd_path }}/CTFd/plugins/nervctf_instance/"
        delete: yes
        rsync_opts:
          - "--chown={{ docker_user }}:docker"
      when: plugin_src is defined

    # ── Remote Monitor binary + Docker image ───────────────────────────────────
    - name: Ensure remote-monitor directory exists
      file:
        path: "{{ ctfd_path }}/remote-monitor"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: monitor_binary is defined

    - name: Copy updated remote-monitor binary
      copy:
        src: "{{ monitor_binary }}"
        dest: "{{ ctfd_path }}/remote-monitor/remote-monitor"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: monitor_binary is defined

    # NOTE: This Dockerfile is duplicated in nervctf_upgrade_playbook.yml / nervctf_playbook.yml — keep them in sync.
    - name: Write remote-monitor Dockerfile
      copy:
        content: |
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                  ca-certificates curl gnupg libsqlite3-0 openssh-client && \
              install -m 0755 -d /etc/apt/keyrings && \
              curl -fsSL https://download.docker.com/linux/debian/gpg \
                | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/debian bookworm stable" \
                > /etc/apt/sources.list.d/docker.list && \
              apt-get update && \
              apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin && \
              rm -rf /var/lib/apt/lists/*
          RUN printf '#!/bin/sh\n\
          if [ -f /run/monitor_ssh_key ]; then\n\
            mkdir -p /root/.ssh && chmod 700 /root/.ssh\n\
            cp /run/monitor_ssh_key /root/.ssh/id_rsa && chmod 600 /root/.ssh/id_rsa\n\
            printf "Host *\\n  StrictHostKeyChecking no\\n  UserKnownHostsFile /dev/null\\n  LogLevel ERROR\\n" > /root/.ssh/config\n\
            chmod 600 /root/.ssh/config\n\
          fi\n\
          exec "$@"\n' > /entrypoint.sh && chmod +x /entrypoint.sh
          COPY remote-monitor /usr/local/bin/remote-monitor
          ENTRYPOINT ["/entrypoint.sh"]
          CMD ["/usr/local/bin/remote-monitor"]
        dest: "{{ ctfd_path }}/remote-monitor/Dockerfile"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"
      when: monitor_binary is defined

    - name: Rebuild remote-monitor Docker image
      command: docker build -t nervctf-monitor:latest {{ ctfd_path }}/remote-monitor
      become_user: "{{ docker_user }}"
      when: monitor_binary is defined

    # ── nervctf-tap binary + Docker image (instance traffic-capture sidecar) ──
    # Replaces nervctf-proxy. Already-running instances keep their old proxy sidecar
    # until they expire; remove_container tears down both the `-tap` and legacy
    # `-proxy` sidecar names, so no instance is left half-removed after this upgrade.
    - name: Ensure nervctf-tap directory exists
      file:
        path: "{{ ctfd_path }}/nervctf-tap"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: tap_binary is defined

    - name: Copy updated nervctf-tap binary
      copy:
        src: "{{ tap_binary }}"
        dest: "{{ ctfd_path }}/nervctf-tap/nervctf-tap"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"
      when: tap_binary is defined

    # NOTE: duplicated in nervctf_playbook.yml and src/nervctf-tap/Dockerfile —
    # keep all three in sync.
    - name: Write nervctf-tap Dockerfile
      copy:
        content: |
          FROM debian:bookworm-slim
          COPY nervctf-tap /usr/local/bin/nervctf-tap
          ENTRYPOINT ["/usr/local/bin/nervctf-tap"]
        dest: "{{ ctfd_path }}/nervctf-tap/Dockerfile"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"
      when: tap_binary is defined

    - name: Rebuild nervctf-tap Docker image
      command: docker build -t nervctf-tap:latest {{ ctfd_path }}/nervctf-tap
      become_user: "{{ docker_user }}"
      when: tap_binary is defined

    - name: Ensure nervctf capture directory exists
      file:
        path: /var/lib/nervctf-captures
        state: directory
        mode: "0777"

    # ── Grafana/Prometheus/Loki data directories (host resource monitoring +
    #    opt-in log_proxy player-traffic logging) ────────────────────────────────
    - name: Ensure Grafana/Prometheus/Loki data directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ ctfd_path }}/grafana/data"
        - "{{ ctfd_path }}/prometheus/data"
        - "{{ ctfd_path }}/loki/data"

    - name: Write Loki config
      copy:
        content: |
          auth_enabled: false
          server:
            http_listen_port: 3100
          common:
            path_prefix: /loki
            storage:
              filesystem:
                chunks_directory: /loki/chunks
                rules_directory: /loki/rules
            replication_factor: 1
            ring:
              kvstore:
                store: inmemory
          schema_config:
            configs:
              - from: 2020-10-24
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            max_line_size: 256KB
            ingestion_rate_mb: 16
            ingestion_burst_size_mb: 32
        dest: "{{ ctfd_path }}/loki/loki-config.yaml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Loki Docker logging-driver plugin ───────────────────────────────────────
    # Required on whichever host actually runs the log-proxy sidecar's `docker run`/
    # `docker compose up` with `--log-driver=loki`: the primary host in single-machine
    # mode (this play), or the runner host in split-machine mode (separate play below).
    - name: Check if Loki Docker logging-driver plugin is installed
      when: runner_ip is not defined
      command: "{% raw %}docker plugin ls --format '{{.Name}}'{% endraw %}"
      register: docker_plugins_primary
      changed_when: false
      failed_when: false

    - name: Install Loki Docker logging-driver plugin
      when: runner_ip is not defined and 'loki:latest' not in docker_plugins_primary.stdout
      command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      register: loki_plugin_install_primary
      failed_when: loki_plugin_install_primary.rc != 0 and 'already exist' not in loki_plugin_install_primary.stderr

    - name: Ensure Prometheus config directory exists
      file:
        path: "{{ ctfd_path }}/prometheus"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Prometheus scrape config
      copy:
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]
            - job_name: remote-monitor
              static_configs:
                - targets: ["remote-monitor:{{ monitor_port }}"]
        dest: "{{ ctfd_path }}/prometheus/prometheus.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Ensure Grafana provisioning directory exists
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/datasources"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Grafana Prometheus datasource
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/prometheus.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write Grafana Loki datasource
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki:3100
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/loki.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── Grafana dashboards (shipped, not left for the operator to build) ───────
    - name: Ensure Grafana dashboard provisioning directory exists
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/dashboards"
        state: directory
        owner: "{{ docker_user }}"
        group: docker
        mode: "0755"

    - name: Write Grafana dashboard provider config
      copy:
        content: |
          apiVersion: 1
          providers:
            - name: NervCTF
              orgId: 1
              folder: ""
              type: file
              disableDeletion: true
              updateIntervalSeconds: 30
              allowUiUpdates: false
              options:
                path: /etc/grafana/provisioning/dashboards
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/dashboards.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write NervCTF host-resources dashboard
      copy:
        content: |
          {
            "title": "NervCTF Host Resources",
            "uid": "nervctf-host-resources",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "CPU usage %",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                    "legendFormat": "CPU"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Memory usage %",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
                    "legendFormat": "Memory"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Disk usage % (root)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"tmpfs\"}) * 100)",
                    "legendFormat": "Disk"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Network I/O (bytes/s)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])",
                    "legendFormat": "RX {{ '{{device}}' }}"
                  },
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])",
                    "legendFormat": "TX {{ '{{device}}' }}"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/host-resources.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── NervCTF Container Logs dashboard ───────────────────────────────────────
    # Was "Player Traffic", built around nervctf-proxy's per-request JSON lines. The
    # tap that replaces the proxy writes raw byte streams to disk, not to Loki, so the
    # old `| json | status >= 400` and `unwrap duration_ms` panels referenced fields
    # that no longer exist anywhere and would render permanently empty.
    #
    # What Loki genuinely holds is every instance container's stdout/stderr, labelled
    # by challenge/team — which is log-shaped, so that is all this dashboard claims to
    # show. Request/response inspection is a session-browsing problem and belongs in
    # remote-monitor's admin UI, over the tap's capture files.
    - name: Write NervCTF container-logs dashboard
      copy:
        content: |
          {
            "title": "NervCTF Container Logs",
            "uid": "nervctf-container-logs",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-1h", "to": "now" },
            "refresh": "30s",
            "templating": {
              "list": [
                {
                  "name": "challenge",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(challenge)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "team_id",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(team_id)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "team_name",
                  "type": "query",
                  "datasource": { "type": "loki", "uid": "loki" },
                  "query": "label_values(team_name)",
                  "refresh": 2,
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "search",
                  "type": "textbox",
                  "label": "Filter (substring)",
                  "query": "",
                  "current": { "text": "", "value": "" }
                }
              ]
            },
            "panels": [
              {
                "id": 1,
                "title": "What this shows",
                "type": "text",
                "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
                "options": {
                  "mode": "markdown",
                  "content": "Container **stdout/stderr** for every instance, labelled by challenge and team. This is whatever the challenge itself printed \u2014 many challenges (nc, pwn) print nothing.\n\nFor what players actually **sent and received**, use the tap's capture files via remote-monitor's admin UI; those bytes are deliberately not shipped here."
                }
              },
              {
                "id": 2,
                "title": "Instance Logs",
                "type": "logs",
                "gridPos": { "h": 15, "w": 24, "x": 0, "y": 3 },
                "datasource": { "type": "loki", "uid": "loki" },
                "options": {
                  "showTime": true,
                  "showLabels": true,
                  "wrapLogMessage": true,
                  "sortOrder": "Descending"
                },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "{challenge=~\"$challenge\", team_id=~\"$team_id\", team_name=~\"$team_name\"} |= \"$search\"",
                    "queryType": "range"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Log Volume by Challenge",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "sum by (challenge) (count_over_time({challenge=~\"$challenge\", team_id=~\"$team_id\", team_name=~\"$team_name\"}[$__interval]))",
                    "queryType": "range"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Loudest Teams (lines)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
                "datasource": { "type": "loki", "uid": "loki" },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "topk(10, sum by (team_name) (count_over_time({challenge=~\"$challenge\", team_id=~\"$team_id\", team_name=~\"$team_name\"}[$__interval])))",
                    "queryType": "range"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/container-logs.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # Remove the superseded dashboard so Grafana stops provisioning panels that query
    # nervctf-proxy fields no longer produced by anything.
    - name: Remove superseded player-traffic dashboard
      file:
        path: "{{ ctfd_path }}/grafana/provisioning/dashboards/player-traffic.json"
        state: absent

    - name: Write NervCTF scoreboard dashboard
      copy:
        content: |
          {
            "title": "NervCTF Scoreboard",
            "uid": "nervctf-scoreboard",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "Team-mode only",
                "type": "text",
                "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
                "options": {
                  "mode": "markdown",
                  "content": "This dashboard assumes CTFd team-mode. A user-mode deployment (`submissions.team_id` is always NULL there) will show empty panels — see the user-mode comments in `ctfd_db.rs` for the join pattern a user-mode variant would need."
                }
              },
              {
                "id": 2,
                "title": "Cumulative Solves Over Time",
                "type": "timeseries",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 3 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT s.date AS time, t.name AS metric, COUNT(*) OVER (PARTITION BY t.id ORDER BY s.date) AS value FROM submissions s JOIN teams t ON t.id = s.team_id WHERE s.type = 'correct' AND t.hidden = 0 AND t.banned = 0 AND $__timeFilter(s.date) ORDER BY s.date",
                    "format": "time_series",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 3,
                "title": "First Blood",
                "type": "table",
                "gridPos": { "h": 10, "w": 12, "x": 0, "y": 13 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, t.name AS first_blood_team, first.ts AS solved_at FROM (SELECT challenge_id, team_id, MIN(date) AS ts FROM submissions WHERE type = 'correct' GROUP BY challenge_id) first JOIN challenges c ON c.id = first.challenge_id JOIN teams t ON t.id = first.team_id WHERE t.hidden = 0 AND t.banned = 0 ORDER BY first.ts ASC",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 4,
                "title": "Challenge Difficulty",
                "type": "table",
                "gridPos": { "h": 10, "w": 12, "x": 12, "y": 13 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, c.value AS current_value, COUNT(DISTINCT s.team_id) AS solves, (SELECT COUNT(*) FROM teams WHERE hidden = 0 AND banned = 0) AS total_teams, ROUND(100.0 * COUNT(DISTINCT s.team_id) / NULLIF((SELECT COUNT(*) FROM teams WHERE hidden = 0 AND banned = 0), 0), 1) AS solve_rate_pct FROM challenges c LEFT JOIN submissions s ON s.challenge_id = c.id AND s.type = 'correct' LEFT JOIN teams t ON t.id = s.team_id AND t.hidden = 0 AND t.banned = 0 GROUP BY c.id, c.name, c.value ORDER BY solve_rate_pct ASC",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/scoreboard.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write NervCTF admin-ops dashboard
      copy:
        content: |
          {
            "title": "NervCTF Admin Ops",
            "uid": "nervctf-admin-ops",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "Flag-Sharing Alerts",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/attempts?alerts_only=true",
                    "url_options": { "method": "GET" },
                    "root_selector": "$"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Active Instances",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 10 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/instances",
                    "url_options": { "method": "GET" },
                    "root_selector": "$"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Event Timeline",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 20 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/events?limit=200",
                    "url_options": { "method": "GET" },
                    "root_selector": "$.data"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/admin-ops.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── NervCTF Integrity dashboard ────────────────────────────────────────────
    # The anti-cheat view. Every panel runs on data that already exists — the
    # monitor's own event log and CTFd's `submissions` table — so none of it depends
    # on traffic capture being enabled, and it covers standard challenges too.
    #
    # Ranked roughly by signal-to-noise: the monitor's own findings first (it knows
    # which flag belongs to which team's instance, so those are near-certain), then
    # the CTFd-derived heuristics, which need an operator's judgement.
    - name: Write NervCTF integrity dashboard
      copy:
        content: |
          {
            "title": "NervCTF Integrity",
            "uid": "nervctf-integrity",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-24h", "to": "now" },
            "refresh": "1m",
            "panels": [
              {
                "id": 1,
                "title": "How to read this",
                "type": "text",
                "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
                "options": {
                  "mode": "markdown",
                  "content": "Panels are ordered by confidence, strongest first.\n\n**Near-certain** (monitor-derived, each instance has a unique flag): *Foreign flag submitted* and *Solved without an instance*. A team cannot solve an instance challenge it was never given an instance of.\n\n**Needs judgement** (CTFd-derived heuristics): the rest. Known false positives \u2014 shared IPs are normal behind one NAT, campus network or VPN; simultaneous solves cluster at challenge release; a challenge converted from standard to instance mid-event will show spurious *Solved without an instance* rows. Confirm before accusing anyone.\n\nTeam-mode only. In CTFd user-mode `submissions.team_id` is NULL and the CTFd-derived panels will be empty."
                }
              },
              {
                "id": 2,
                "title": "Foreign flag submitted (near-certain)",
                "description": "A team submitted a flag that belongs to another team's instance. The monitor generates a unique flag per instance, so this is direct evidence of sharing.",
                "type": "table",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/attempts?alerts_only=true",
                    "url_options": { "method": "GET" },
                    "root_selector": "$"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Solved without an instance (near-certain)",
                "description": "Correct solve for an instance challenge with no instance.requested event for that team, or a solve timestamped before their first request. There was nothing for them to solve.",
                "type": "table",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 15 },
                "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                "targets": [
                  {
                    "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "nervctf-infinity" },
                    "type": "json",
                    "source": "url",
                    "format": "table",
                    "url": "/api/v1/admin/integrity",
                    "url_options": { "method": "GET" },
                    "root_selector": "$"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Same wrong flag submitted by multiple teams",
                "description": "Two teams submitting the identical incorrect string for the same challenge shared an answer. One of the strongest CTFd-only signals, because a wrong guess is not independently reproducible.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, s.provided AS submitted_flag, COUNT(DISTINCT s.team_id) AS teams, GROUP_CONCAT(DISTINCT t.name ORDER BY t.name SEPARATOR ', ') AS team_names, MIN(s.date) AS first_seen FROM submissions s JOIN teams t ON t.id = s.team_id JOIN challenges c ON c.id = s.challenge_id WHERE s.type = 'incorrect' AND t.hidden = 0 AND t.banned = 0 AND CHAR_LENGTH(s.provided) >= 8 GROUP BY s.challenge_id, c.name, s.provided HAVING teams > 1 ORDER BY teams DESC, first_seen ASC LIMIT 200",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 5,
                "title": "Submission IP shared across teams",
                "description": "CTFd records the submitter IP. The same address submitting for several teams suggests one person on multiple accounts. Expect false positives behind a shared NAT, campus network or VPN.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 34 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT s.ip AS ip, COUNT(DISTINCT s.team_id) AS teams, GROUP_CONCAT(DISTINCT t.name ORDER BY t.name SEPARATOR ', ') AS team_names, COUNT(*) AS submissions, MIN(s.date) AS first_seen, MAX(s.date) AS last_seen FROM submissions s JOIN teams t ON t.id = s.team_id WHERE s.ip IS NOT NULL AND s.ip <> '' AND t.hidden = 0 AND t.banned = 0 GROUP BY s.ip HAVING teams > 1 ORDER BY teams DESC, submissions DESC LIMIT 200",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 6,
                "title": "Near-simultaneous solves (same challenge, within 3 min)",
                "description": "Team pairs solving the same challenge close together. Clusters legitimately at challenge release, so read it alongside the first-blood times on the Scoreboard dashboard.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 44 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT c.name AS challenge, ta.name AS team_a, tb.name AS team_b, a.date AS first_solved_at, ABS(TIMESTAMPDIFF(SECOND, a.date, b.date)) AS seconds_apart FROM submissions a JOIN submissions b ON b.challenge_id = a.challenge_id AND b.type = 'correct' AND b.team_id > a.team_id AND ABS(TIMESTAMPDIFF(SECOND, a.date, b.date)) <= 180 JOIN challenges c ON c.id = a.challenge_id JOIN teams ta ON ta.id = a.team_id JOIN teams tb ON tb.id = b.team_id WHERE a.type = 'correct' AND ta.hidden = 0 AND ta.banned = 0 AND tb.hidden = 0 AND tb.banned = 0 ORDER BY seconds_apart ASC LIMIT 200",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              },
              {
                "id": 7,
                "title": "Flag brute-forcing",
                "description": "Teams with a high rate of incorrect submissions on one challenge — scripted guessing rather than solving. Only rows with at least 20 wrong attempts are shown.",
                "type": "table",
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 54 },
                "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                "targets": [
                  {
                    "datasource": { "type": "mysql", "uid": "ctfd-mysql" },
                    "rawSql": "SELECT t.name AS team, c.name AS challenge, COUNT(*) AS incorrect, TIMESTAMPDIFF(SECOND, MIN(s.date), MAX(s.date)) AS window_seconds, ROUND(COUNT(*) * 60.0 / GREATEST(TIMESTAMPDIFF(SECOND, MIN(s.date), MAX(s.date)), 1), 1) AS per_minute FROM submissions s JOIN teams t ON t.id = s.team_id JOIN challenges c ON c.id = s.challenge_id WHERE s.type = 'incorrect' AND t.hidden = 0 AND t.banned = 0 GROUP BY t.id, t.name, c.id, c.name HAVING incorrect >= 20 ORDER BY per_minute DESC LIMIT 100",
                    "format": "table",
                    "rawQuery": true
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/integrity.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    - name: Write NervCTF provisioning-health dashboard
      copy:
        content: |
          {
            "title": "NervCTF Provisioning Health",
            "uid": "nervctf-provisioning-health",
            "schemaVersion": 39,
            "editable": true,
            "time": { "from": "now-6h", "to": "now" },
            "refresh": "30s",
            "panels": [
              {
                "id": 1,
                "title": "Provisioning Rate by Outcome",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "rate(nervctf_provision_total[5m])",
                    "legendFormat": "{{ '{{result}}' }}"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Active Instances",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "nervctf_active_instances",
                    "legendFormat": "{{ '{{status}}' }}"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Provisioning Queue Saturation",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "nervctf_provision_queue_available",
                    "legendFormat": "available"
                  },
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "nervctf_provision_queue_capacity",
                    "legendFormat": "capacity"
                  }
                ]
              }
            ]
          }
        dest: "{{ ctfd_path }}/grafana/provisioning/dashboards/provisioning-health.json"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0644"

    # ── docker-compose override (monitor service + CTFd env) ───────────────────
    # Re-write the override so config changes (monitor_port, max_concurrent_provisions,
    # max_instances_per_team, etc.) take effect without requiring a full re-setup.
    - name: Read CTFd .env for database URL
      slurp:
        src: "{{ ctfd_path }}/.env"
      register: ctfd_env_raw
      failed_when: false

    - name: Extract CTFD_DB_URL from CTFd .env
      set_fact:
        ctfd_db_url: >-
          {{
            (ctfd_env_raw.content | default('') | b64decode)
            | regex_findall('DATABASE_URL=([^\n\r]+)')
            | first
            | default('mysql://ctfd:ctfd@db/ctfd')
            | regex_replace('\+pymysql', '')
          }}

    # Decompose ctfd_db_url (mysql://user:pass@host[:port]/db) into discrete fields —
    # Grafana's MySQL datasource wants separate host/port/database/user/password, not
    # a single connection URL. Placed here (not alongside the other datasource-writing
    # tasks above) because this is the earliest point ctfd_db_url is known in this
    # playbook's task order.
    - name: Decompose CTFD_DB_URL for Grafana's MySQL datasource
      set_fact:
        ctfd_db_user: "{{ ctfd_db_url | regex_replace('^mysql://([^:]+):.*$', '\\1') }}"
        ctfd_db_pass: "{{ ctfd_db_url | regex_replace('^mysql://[^:]+:([^@]+)@.*$', '\\1') }}"
        ctfd_db_host_raw: "{{ ctfd_db_url | regex_replace('^mysql://[^@]+@([^/]+)/.*$', '\\1') }}"
        ctfd_db_name: "{{ ctfd_db_url | regex_replace('^mysql://[^/]+/([^?]*).*$', '\\1') }}"

    - name: Append default MySQL port if CTFD_DB_URL host had none
      set_fact:
        ctfd_db_host: "{{ ctfd_db_host_raw if ':' in ctfd_db_host_raw else ctfd_db_host_raw + ':3306' }}"

    # Reuses remote-monitor's own CTFd DB credentials (full read-write) rather than a
    # scoped read-only grant — see the matching comment in nervctf_playbook.yml for why.
    - name: Write Grafana MySQL datasource (CTFd's MariaDB, for scoreboard dashboards)
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: CTFd
              uid: ctfd-mysql
              type: mysql
              access: proxy
              url: "{{ ctfd_db_host }}"
              database: "{{ ctfd_db_name }}"
              user: "{{ ctfd_db_user }}"
              secureJsonData:
                password: "{{ ctfd_db_pass }}"
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/mysql.yml"
        owner: "{{ docker_user }}"
        # Group root, not docker: the Grafana image runs as uid 472 / gid 0, so it is
        # neither the owner nor in the `docker` group and cannot read a 0640 file —
        # provisioning then fails with "permission denied" and Grafana crash-loops,
        # taking every dashboard down with it. Group 0 lets Grafana read it while
        # keeping the file non-world-readable, which matters here because unlike the
        # other datasource files this one carries a credential.
        group: "0"
        mode: "0640"

    - name: Write Grafana Infinity datasource (remote-monitor's admin JSON API)
      copy:
        content: |
          apiVersion: 1
          datasources:
            - name: NervCTF Admin API
              uid: nervctf-infinity
              type: yesoreyeram-infinity-datasource
              access: proxy
              url: "http://remote-monitor:{{ monitor_port }}"
              jsonData:
                httpHeaderName1: "Authorization"
              secureJsonData:
                httpHeaderValue1: "Token {{ monitor_token }}"
        dest: "{{ ctfd_path }}/grafana/provisioning/datasources/infinity.yml"
        owner: "{{ docker_user }}"
        # Group root, not docker: the Grafana image runs as uid 472 / gid 0, so it is
        # neither the owner nor in the `docker` group and cannot read a 0640 file —
        # provisioning then fails with "permission denied" and Grafana crash-loops,
        # taking every dashboard down with it. Group 0 lets Grafana read it while
        # keeping the file non-world-readable, which matters here because unlike the
        # other datasource files this one carries a credential.
        group: "0"
        mode: "0640"

    - name: Resolve runner hostname to IP on CTFd host
      when: runner_ip is defined
      command: "getent hosts {{ runner_ip }}"
      register: runner_getent
      changed_when: false
      failed_when: false

    - name: Set runner_resolved_ip fact
      when: runner_ip is defined
      set_fact:
        runner_resolved_ip: >-
          {{
            (runner_getent.stdout.split() | first)
            if (runner_getent is defined and (runner_getent.rc | int) == 0 and runner_getent.stdout != '')
            else runner_ip
          }}

    # ── SSH keypair for monitor→runner (generate if missing, preserve if existing) ─
    - name: Generate SSH keypair for remote-monitor (split mode, if missing)
      when: runner_ip is defined
      command: >-
        ssh-keygen -t rsa -b 4096 -N ""
        -f {{ ctfd_path }}/remote-monitor/monitor_ssh_key
      args:
        creates: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key"
      become_user: "{{ docker_user }}"

    - name: Set monitor SSH private key permissions
      when: runner_ip is defined
      file:
        path: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key"
        mode: "0600"
        owner: "{{ docker_user }}"
        group: docker
      failed_when: false

    - name: Read monitor SSH public key
      when: runner_ip is defined
      slurp:
        src: "{{ ctfd_path }}/remote-monitor/monitor_ssh_key.pub"
      register: monitor_pubkey_raw
      failed_when: false

    - name: Set monitor_pubkey fact
      when: runner_ip is defined and monitor_pubkey_raw.content is defined
      set_fact:
        monitor_pubkey: "{{ monitor_pubkey_raw.content | b64decode | trim }}"

    # ── External reverse proxy (external_proxy) ───────────────────────────────
    # See the matching block in nervctf_playbook.yml for the full rationale: CTFd's
    # bundled nginx binds :80 and loses to a host proxy that already holds it, failing
    # the whole `compose up`. Probed against the BASE compose file only, never the
    # override written below.
    - name: Check whether CTFd's compose file defines an nginx service
      command: docker compose -f {{ ctfd_path }}/docker-compose.yml config --services
      register: ctfd_compose_services
      changed_when: false
      failed_when: false

    - name: Record whether CTFd ships its own nginx
      set_fact:
        ctfd_has_nginx: "{{ 'nginx' in (ctfd_compose_services.stdout_lines | default([])) }}"

    - name: Write docker-compose override
      when: monitor_token is defined
      copy:
        content: |
          services:
            ctfd:
              environment:
                NERVCTF_MONITOR_URL: "http://remote-monitor:{{ monitor_port }}"
                NERVCTF_MONITOR_TOKEN: {{ monitor_token | to_json }}
          {% if event_name is defined %}
                NERVCTF_EVENT_NAME: {{ event_name | to_json }}
          {% endif %}
          {% if event_description is defined %}
                NERVCTF_EVENT_DESCRIPTION: {{ event_description | to_json }}
          {% endif %}
          {% if user_mode is defined %}
                NERVCTF_USER_MODE: {{ user_mode | to_json }}
          {% endif %}
          {% if admin_user is defined and admin_email is defined and admin_password is defined %}
                NERVCTF_ADMIN_USER: {{ admin_user | to_json }}
                NERVCTF_ADMIN_EMAIL: {{ admin_email | to_json }}
                NERVCTF_ADMIN_PASSWORD: {{ admin_password | to_json }}
          {% endif %}

            remote-monitor:
              image: nervctf-monitor:latest
              restart: unless-stopped
              environment:
                - CTFD_DB_URL={{ ctfd_db_url }}
                - MONITOR_TOKEN={{ monitor_token }}
                - PUBLIC_HOST={{ runner_domain | default(runner_ip) | default(ansible_host) }}
                - MONITOR_PORT={{ monitor_port }}
                - DB_PATH={{ ctfd_path }}/remote-monitor/data/monitor.db
          {% if runner_ip is defined %}
                - CHALLENGES_BASE_DIR=/home/{{ runner_user | default('docker') }}/challenges
                - RUNNER_SSH_TARGET={{ runner_user | default('docker') }}@{{ runner_resolved_ip | default(runner_ip) }}
          {% else %}
                - CHALLENGES_BASE_DIR={{ ctfd_path }}/remote-monitor/data/challenges
          {% endif %}
                - CTFD_UPLOADS_DIR={{ ctfd_path }}/.data/CTFd/uploads
                # Always loopback — see docker.rs::loki_log_args and the reverse
                # SSH tunnel task below for why this is correct in split-machine
                # mode too.
                - LOKI_URL=http://127.0.0.1:3100/loki/api/v1/push
                - CAPTURE_BASE_DIR=/var/lib/nervctf-captures
                - MAX_CONCURRENT_PROVISIONS={{ max_concurrent_provisions }}
                - MAX_INSTANCES_PER_TEAM={{ max_instances_per_team }}
          {% if ctfd_domain is defined and ctfd_domain %}
                - CTFD_DOMAIN={{ ctfd_domain }}
          {% endif %}
              networks:
                - default
                - internal
              volumes:
          {% if runner_ip is defined %}
                - {{ ctfd_path }}/remote-monitor/monitor_ssh_key:/run/monitor_ssh_key:ro
          {% else %}
                - /var/run/docker.sock:/var/run/docker.sock
                - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
                - /tmp/ctf-flags:/tmp/ctf-flags
                # Read-write, not :ro — the monitor creates the per-instance
                # subdirectory before launching a tap sidecar. Mounted read-only,
                # that create_dir_all failed with EROFS and took the whole
                # provision down with it.
                - /var/lib/nervctf-captures:/var/lib/nervctf-captures
          {% endif %}
                - {{ ctfd_path }}/remote-monitor/data:{{ ctfd_path }}/remote-monitor/data
                - {{ ctfd_path }}/.data/CTFd/uploads:{{ ctfd_path }}/.data/CTFd/uploads
              ports:
                - "{{ monitor_port }}:{{ monitor_port }}"

            # Prometheus/node-exporter/Grafana: always-on host resource monitoring
            # (CPU/RAM/disk/network for the CTFd host). node-exporter is reached only
            # by Prometheus over the compose network, never published to the host.
            prometheus:
              image: prom/prometheus:latest
              restart: unless-stopped
              networks:
                - default
              volumes:
                - {{ ctfd_path }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - {{ ctfd_path }}/prometheus/data:/prometheus
              # Loopback-only, unconditionally: Prometheus only scrapes node-exporter
              # and is only read by Grafana — both always on this same host, over the
              # compose network. No cross-host case needs port 9090 published beyond
              # localhost.
              ports:
                - "127.0.0.1:9090:9090"

            node-exporter:
              image: prom/node-exporter:latest
              restart: unless-stopped
              networks:
                - default
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - --path.procfs=/host/proc
                - --path.sysfs=/host/sys
                - --path.rootfs=/rootfs
                - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)

            # Loki: stores player-traffic JSON lines shipped by opt-in `log_proxy`
            # sidecars. Loopback-only, unconditionally — see the primary playbook
            # for the full rationale.
            loki:
              # Pinned, not :latest — see the primary playbook for why.
              image: grafana/loki:2.9.10
              restart: unless-stopped
              networks:
                - default
              volumes:
                - {{ ctfd_path }}/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
                - {{ ctfd_path }}/loki/data:/loki
              ports:
                - "127.0.0.1:3100:3100"

            grafana:
              image: grafana/grafana:latest
              restart: unless-stopped
              networks:
                - default
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD={{ monitor_token }}
                - GF_AUTH_ANONYMOUS_ENABLED=false
                - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
              volumes:
                - {{ ctfd_path }}/grafana/data:/var/lib/grafana
                - {{ ctfd_path }}/grafana/provisioning:/etc/grafana/provisioning:ro
              ports:
          {% if runner_ip is defined %}
                - "3000:3000"
          {% else %}
                - "127.0.0.1:3000:3000"
          {% endif %}
              depends_on:
                - prometheus
                - loki

          {% if external_proxy | default(false) | bool and ctfd_has_nginx | default(false) | bool %}
            # external_proxy: true — the host terminates HTTP(S), so CTFd's bundled
            # nginx must not compete for :80. A compose profile leaves the service
            # defined but never started; `--remove-orphans` on the recreate below reaps
            # any container an earlier run already created. nervctf deliberately does
            # not touch CTFd's own port mappings — point the host proxy at CTFd's
            # published port (8000 by default). See docs/remote-monitor.md.
            nginx:
              profiles: ["nervctf-disabled"]
          {% endif %}
          # Explicitly declare the networks used by remote-monitor so Docker Compose
          # correctly joins it to the existing project networks (not creating new ones).
          networks:
            default: {}
            internal: {}
        dest: "{{ ctfd_path }}/docker-compose.override.yml"
        owner: "{{ docker_user }}"
        group: docker
        mode: "0640"

    # ── Restart services ───────────────────────────────────────────────────────
    # Restart remote-monitor first (new image, no state loss — DB is a bind-mounted file).
    - name: Restart remote-monitor container
      command:
        cmd: docker compose up -d --force-recreate remote-monitor
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"
      when: monitor_binary is defined

    # Only the monitoring stack — never recreate the whole stack just for this, so
    # an upgrade that only touches these doesn't bounce the CTFd/nginx containers
    # players are using. --remove-orphans also reaps containers for services no
    # longer defined in the combined compose files.
    - name: Apply Prometheus/node-exporter/Grafana/Loki (new image or config)
      command:
        cmd: docker compose up -d --force-recreate --remove-orphans prometheus node-exporter grafana loki
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"

    # Recreate the whole stack so the override's environment is applied and
    # nginx re-resolves the ctfd container (a `restart` keeps both the old env
    # and the old upstream IP, which produces 502s after ctfd is recreated).
    - name: Recreate CTFd stack (applies env, reloads plugin, refreshes nginx)
      command:
        cmd: docker compose up -d --force-recreate --remove-orphans
        chdir: "{{ ctfd_path }}"
      become_user: "{{ docker_user }}"
      when: plugin_src is defined

# ── Runner: re-authorize monitor SSH key ──────────────────────────────────────
# Runs only when runner_ip is set (split-machine mode). Re-syncs the public key
# that the monitor container uses to SSH into the runner for docker compose ops.
# Without this, upgrades that replace the monitor container break instance builds.
- hosts: runner
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"
  tasks:
    - name: Authorize remote-monitor SSH public key on runner
      when: runner_ip is defined
      authorized_key:
        user: "{{ runner_user | default(docker_user) }}"
        state: present
        key: "{{ hostvars[groups['ctfd'][0]]['monitor_pubkey'] }}"

    - name: Ensure runner_user is in docker group
      when: (runner_user | default(docker_user)) != 'root'
      user:
        name: "{{ runner_user | default(docker_user) }}"
        groups: docker
        append: yes

    # ── Loki Docker logging-driver plugin (runner side) ────────────────────────
    - name: Check if Loki Docker logging-driver plugin is installed on runner
      when: runner_ip is defined
      command: "{% raw %}docker plugin ls --format '{{.Name}}'{% endraw %}"
      register: docker_plugins_runner
      changed_when: false
      failed_when: false

    - name: Install Loki Docker logging-driver plugin on runner
      when: runner_ip is defined and 'loki:latest' not in docker_plugins_runner.stdout
      command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
      register: loki_plugin_install_runner
      failed_when: loki_plugin_install_runner.rc != 0 and 'already exist' not in loki_plugin_install_runner.stderr

    # ── nervctf-tap image (runner side) ───────────────────────────────────────
    # Split-machine mode runs the tap sidecar on THIS host, so the image must exist
    # here. nervctf-proxy was only ever built on the primary host — a split-machine
    # deployment that opted into log_proxy would have failed with "image not found".
    - name: Ensure nervctf-tap directory exists on runner
      file:
        path: /opt/nervctf/tap
        state: directory
        mode: "0755"
      when: runner_ip is defined and tap_binary is defined

    - name: Copy nervctf-tap binary to runner
      copy:
        src: "{{ tap_binary }}"
        dest: /opt/nervctf/tap/nervctf-tap
        mode: "0755"
      when: runner_ip is defined and tap_binary is defined

    - name: Write nervctf-tap Dockerfile on runner
      copy:
        content: |
          FROM debian:bookworm-slim
          COPY nervctf-tap /usr/local/bin/nervctf-tap
          ENTRYPOINT ["/usr/local/bin/nervctf-tap"]
        dest: /opt/nervctf/tap/Dockerfile
        mode: "0644"
      when: runner_ip is defined and tap_binary is defined

    - name: Rebuild nervctf-tap Docker image on runner
      command: docker build -t nervctf-tap:latest /opt/nervctf/tap
      when: runner_ip is defined and tap_binary is defined

    - name: Ensure nervctf capture directory exists on runner
      file:
        path: /var/lib/nervctf-captures
        state: directory
        mode: "0777"
      when: runner_ip is defined

# ── Reverse SSH tunnel: primary → runner (split-machine mode only) ────────────
# See the primary playbook for the full rationale. Re-applied on every upgrade
# in case the systemd unit or monitor_ssh_key path changed.
- hosts: ctfd
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    docker_user: "{{ ansible_user }}"
  tasks:
    - name: Install autossh (split-machine Loki tunnel)
      when: runner_ip is defined
      apt:
        name: autossh
        state: present
        update_cache: yes

    - name: Write systemd unit for primary→runner Loki reverse tunnel
      when: runner_ip is defined
      copy:
        content: |
          [Unit]
          Description=NervCTF: reverse-forward Loki (3100) to the runner over SSH
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i {{ ctfd_path }}/remote-monitor/monitor_ssh_key \
            -R 3100:127.0.0.1:3100 \
            {{ runner_user | default('docker') }}@{{ runner_resolved_ip | default(runner_ip) }}
          Restart=always
          RestartSec=5
          User={{ docker_user }}

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/nervctf-loki-tunnel.service
        mode: "0644"
      register: loki_tunnel_unit

    - name: Enable and (re)start the Loki reverse-tunnel service
      when: runner_ip is defined
      systemd:
        name: nervctf-loki-tunnel
        daemon_reload: "{{ loki_tunnel_unit.changed }}"
        enabled: yes
        state: "{{ 'restarted' if loki_tunnel_unit.changed else 'started' }}"
