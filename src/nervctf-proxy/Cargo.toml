[package]
name = "nervctf-proxy"
version = "2.11.0"
edition = "2021"

[[bin]]
name = "nervctf-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
reqwest = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1.0"
bytes = "1.0"
